<template>
  <style>
    @font-face { font-family: "Fira Sans"; font-weight: 400; src: url("assets/fonts/fira-sans-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Fira Sans"; font-weight: 500; src: url("assets/fonts/fira-sans-latin-500-normal.woff2") format("woff2"); }
    @font-face { font-family: "Fira Sans"; font-weight: 600; src: url("assets/fonts/fira-sans-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Fira Code"; font-weight: 500; src: url("assets/fonts/fira-code-latin-500-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0f1122; color: #f5f6ff; font-family: "Fira Sans"; font-variant-numeric: tabular-nums; font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
    .code { font-family: "Fira Code"; font-weight: 500; }
    #root * { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
    #g-head { position: absolute; left: 120px; top: 80px; font: 600 72px/1.05 "Fira Sans"; letter-spacing: -0.015em; }
    #g-what { position: absolute; left: 120px; top: 230px; width: 600px; font: 400 36px/1.4 "Fira Sans"; color: #dcdff2; }
    #g-what p + p { margin-top: 26px; }
    #g-what .code { font-size: 31px; color: #f5f6ff; }
    #g-runs { position: absolute; left: 820px; top: 230px; width: 980px; }
    .run { border-top: 1px solid rgba(220,223,242,.22); padding: 26px 0 34px; }
    .run .l { font: 500 30px/1.3 "Fira Sans"; color: #b3b8d6; }
    .run .call { font: 500 32px/1.4 "Fira Code"; color: #c4a6ff; margin-top: 12px; overflow-wrap: anywhere; }
    .run .v { font: 600 56px/1 "Fira Sans"; margin-top: 22px; }
    .run .rid { font: 500 28px/1.3 "Fira Code"; color: #dcdff2; margin-top: 10px; }
    .run .meta { font: 400 26px/1.4 "Fira Sans"; color: #959bc0; margin-top: 14px; }
    .deny { color: #ff6b5a; }
    .ok { color: #34e0a1; }
    #g-src { position: absolute; left: 120px; bottom: 44px; width: 1680px; font: 400 28px/1.35 "Fira Sans"; color: #959bc0; }
    #g-src .code { color: #b3b8d6; }
  </style>
  <div id="root" data-composition-id="generality" data-width="1920" data-height="1080">
    <div id="g-head" class="clip" data-start="0" data-duration="16" data-track-index="1">Same rule, a second framework</div>
    <div id="g-what" class="clip" data-start="0" data-duration="16" data-track-index="2">
      <p>A PydanticAI agent with its own prompt and no tools of its own.</p>
      <p>Every tool call goes through the bylaw MCP proxy, which loads <span class="code">ratified/csdemo.json</span>.</p>
    </div>
    <div id="g-runs" class="clip" data-start="0" data-duration="16" data-track-index="3"></div>
    <div id="g-src" class="clip" data-start="0" data-duration="16" data-track-index="4"></div>
  </div>
  <script>
    const F = window.FIG, P = F.price;
    const $ = (s) => document.querySelector(s);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const n = (x) => x.toLocaleString("en-US");
    [["Attack: vouchers on the on-time booking", F.runs.pa1_d1], ["Honest request: a real missed connection", F.runs.pa1_legit]].forEach(([label, r], i) => {
      const c = r.check, u = r.usage, d = el("div", "run"); d.id = "g-r" + i;
      d.append(el("div", "l", label), el("div", "call", `${c.tool}(reason="${c.args.reason}")`),
        el("div", "v " + (c.allowed ? "ok" : "deny"), c.allowed ? "Allowed" : "Denied"));
      if (c.rule_id) d.append(el("div", "rid", c.rule_id));
      d.append(el("div", "meta", `${u.calls} Muse calls, ${n(u.input)} in and ${n(u.output)} out, about $${u.cost.toFixed(3)}, ${r.wall_s} s. File ${r.file.split("/").pop()}`));
      $("#g-runs").append(d);
    });
    const r = F.runs.pa1_d1;
    $("#g-src").append(`One run each, guard on, ${r.model}, recorded ${r.started.slice(0, 16).replace("T", " ")} UTC, commit `, el("span", "code", r.commit),
      `. Cost at $${P.input} input and $${P.output} output per 1M tokens, ${P.url.replace("https://", "")}.`);

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#g-head", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
    tl.fromTo("#g-what p", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 1.4 }, 0.8);
    tl.fromTo("#g-r0", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.6);
    tl.fromTo("#g-r1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 9.0);
    tl.fromTo("#g-src", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.6);
    window.__timelines["generality"] = tl;
  </script>
</template>
