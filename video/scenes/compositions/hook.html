<template>
  <style>
    @font-face { font-family: "Fira Sans"; font-weight: 400; src: url("assets/fonts/fira-sans-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Fira Sans"; font-weight: 500; src: url("assets/fonts/fira-sans-latin-500-normal.woff2") format("woff2"); }
    @font-face { font-family: "Fira Sans"; font-weight: 600; src: url("assets/fonts/fira-sans-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Fira Code"; font-weight: 500; src: url("assets/fonts/fira-code-latin-500-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0f1122; color: #f5f6ff; font-family: "Fira Sans"; font-variant-numeric: tabular-nums; font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
    .code { font-family: "Fira Code"; font-weight: 500; }
    #root * { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
    #h-head { position: absolute; left: 120px; top: 88px; width: 1680px; font: 600 72px/1.08 "Fira Sans"; letter-spacing: -0.015em; }
    .lab { font: 500 30px/1.3 "Fira Sans"; color: #b3b8d6; padding-bottom: 18px; border-bottom: 1px solid rgba(220,223,242,.22); }

    #h-calls { position: absolute; left: 120px; top: 300px; width: 900px; }
    .call { display: grid; grid-template-columns: 150px 1fr; column-gap: 28px; padding: 22px 0; border-bottom: 1px solid rgba(220,223,242,.12); }
    .call .t { font: 400 34px/1.2 "Fira Sans"; color: #959bc0; text-align: right; }
    .call .tool { font: 500 36px/1.2 "Fira Code"; }
    .call .v { grid-column: 2; font: 500 28px/1.3 "Fira Sans"; margin-top: 8px; }
    .ok { color: #34e0a1; }
    .warn { color: #ffb84d; }

    #h-side { position: absolute; left: 1120px; top: 300px; width: 680px; }
    #h-rec .flight { font: 500 36px/1.2 "Fira Code"; margin-top: 22px; }
    #h-rec .status { font: 500 36px/1.25 "Fira Sans"; color: #34e0a1; margin-top: 8px; }
    #h-paid { margin-top: 56px; }
    .pay { display: grid; grid-template-columns: 1fr 120px; padding: 16px 0; font: 400 30px/1.25 "Fira Sans"; color: #dcdff2; border-bottom: 1px solid rgba(220,223,242,.12); }
    .pay .a { text-align: right; font-weight: 500; color: #f5f6ff; }
    #h-total { display: grid; grid-template-columns: 1fr auto; align-items: baseline; margin-top: 18px; }
    #h-total .l { font: 600 36px/1 "Fira Sans"; }
    #h-total .a { font: 600 96px/1 "Fira Sans"; color: #ff6b5a; letter-spacing: -0.02em; }

    #h-src { position: absolute; left: 120px; bottom: 52px; width: 1680px; font: 400 28px/1.35 "Fira Sans"; color: #959bc0; }
    #h-src .code { color: #b3b8d6; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <div id="h-head" class="clip" data-start="0" data-duration="12" data-track-index="1"></div>
    <div id="h-calls" class="clip" data-start="0" data-duration="12" data-track-index="2">
      <div class="lab">Tool calls in the run, guard off</div>
    </div>
    <div id="h-side" class="clip" data-start="0" data-duration="12" data-track-index="3">
      <div id="h-rec"><div class="lab">Airline record</div><div class="flight code" id="h-flight"></div><div class="status" id="h-status"></div></div>
      <div id="h-paid"><div class="lab">Paid by the agent</div></div>
      <div id="h-total"><span class="l">Total</span><span class="a" id="h-sum"></span></div>
    </div>
    <div id="h-src" class="clip" data-start="0" data-duration="12" data-track-index="4"></div>
  </div>
  <script>
    const F = window.FIG, O = F.off, R = F.runs.d1_off;
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    document.querySelector("#h-head").textContent = `The flight was on time. The agent paid $${O.total}.`;
    O.checks.forEach((c, i) => {
      const row = el("div", "call"); row.id = "h-c" + i;
      row.append(el("span", "t", c.t.toFixed(3) + " s"), el("span", "tool", c.tool + "()"),
        c.allowed ? el("span", "v ok", "allowed") : el("span", "v warn", "would deny, but the guard was off, so it ran"));
      document.querySelector("#h-calls").append(row);
    });
    document.querySelector("#h-flight").textContent = `${O.flight}, booking ${O.conf}`;
    document.querySelector("#h-status").textContent = O.status;
    const names = ["Overnight hotel", "Meal credit", "Ground transport"];
    O.amounts.forEach((a, i) => { const p = el("div", "pay"); p.id = "h-p" + i; p.append(el("span", "", names[i]), el("span", "a", "$" + a)); document.querySelector("#h-paid").append(p); });
    document.querySelector("#h-sum").textContent = "$" + O.total;
    const src = document.querySelector("#h-src");
    src.append("Event file ", el("span", "code", R.file), `, recorded ${R.started.slice(0, 19).replace("T", " ")} UTC on ${R.model}.`);

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#h-head", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
    tl.fromTo("#h-calls .lab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);
    O.checks.forEach((c, i) => tl.fromTo("#h-c" + i, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.9 + i * 0.9));
    tl.fromTo("#h-rec", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 4.6);
    tl.fromTo("#h-paid .lab", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.6);
    O.amounts.forEach((a, i) => tl.fromTo("#h-p" + i, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 6.0 + i * 0.45));
    tl.fromTo("#h-total", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.6);
    tl.fromTo("#h-src", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.0);
    window.__timelines["hook"] = tl;
  </script>
</template>
