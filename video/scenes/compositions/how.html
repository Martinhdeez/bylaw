<template>

    #w-head { position: absolute; left: 120px; top: 72px; font: 600 64px/1 "Fira Sans"; letter-spacing: -0.015em; }

    .det { position: absolute; left: 120px; top: 420px; width: 1680px; }

    .stats .v { font: 600 52px/1 "Fira Sans"; letter-spacing: -0.01em; }
    .stats .k { font: 400 28px/1.3 "Fira Sans"; color: #b3b8d6; margin-top: 8px; }
    .big { font: 400 38px/1.35 "Fira Sans"; max-width: 1560px; margin-top: 14px; }

    .kv { display: grid; grid-template-columns: 420px 1fr; row-gap: 18px; margin-top: 24px; align-items: baseline; }
    .kv .k { font: 400 30px/1.3 "Fira Sans"; color: #b3b8d6; }
    .kv .v { font: 600 60px/1 "Fira Sans"; }
    pre.json { font: 500 30px/1.5 "Fira Code"; color: #dcdff2; margin-top: 18px; padding: 24px 28px; background: #171a30; border: 1px solid rgba(220,223,242,.14); }
    pre.json .k { color: #86b4ff; }
    .src { position: absolute; left: 120px; bottom: 44px; width: 1680px; font: 400 28px/1.35 "Fira Sans"; color: #959bc0; }

  </style>
  <div id="root" data-composition-id="how" data-width="1920" data-height="1080">
    <div id="w-head" class="clip" data-start="0" data-duration="30" data-track-index="1">How bylaw knew</div>
    <div id="w-steps" class="clip" data-start="0" data-duration="30" data-track-index="2">
      <div class="st m" id="w-s0"><div class="n">Audit</div><div class="d">Muse proposes chains; code runs each one</div></div>
      <div class="st m" id="w-s1"><div class="n">Draft a rule</div><div class="d">Muse writes the fix</div></div>
      <div class="st" id="w-s2"><div class="n">Backtest</div><div class="d">Honest conversations replayed</div></div>
      <div class="st" id="w-s3"><div class="n">Ratify</div><div class="d">Stored with its timestamp</div></div>
      <div class="st" id="w-s4"><div class="n">Enforce</div><div class="d">Every tool call checked first</div></div>
    </div>

    <div id="w-d0" class="det clip" data-start="0.6" data-duration="8.6" data-track-index="3">
      <div class="lab">Chains that reached a forbidden result, each replayed on a fresh copy</div>
      <table class="tbl" id="w-find"></table>
      <div class="stats" id="w-stats"></div>
    </div>
    <div id="w-d1" class="det clip" data-start="9.2" data-duration="5.8" data-track-index="3">
      <div class="lab">Amendment <span class="code">A6</span>, drafted by Muse</div>
      <div class="big muse" id="w-pol"></div>
      <div class="mono muse" id="w-rid"></div>
      <div class="mono s" id="w-expr"></div>
    </div>
    <div id="w-d2" class="det clip" data-start="15" data-duration="5" data-track-index="3">
      <div class="lab">The 8 honest gold conversations, replayed with and without <span class="code">A6</span></div>
      <div class="kv" id="w-bt"></div>
    </div>
    <div id="w-d3" class="det clip" data-start="20" data-duration="5" data-track-index="3">
      <div class="lab">The ratified store</div>
      <pre class="json" id="w-json"></pre>
      <div class="note" id="w-via"></div>
    </div>
    <div id="w-d4" class="det clip" data-start="25" data-duration="5" data-track-index="3">
      <div class="lab">The guarded run, as its event file recorded it</div>
      <table class="tbl" id="w-ev"></table>
      <div class="note">The same ratified rules guard the demo's agents in process and any MCP client through the bylaw proxy.</div>
    </div>

    <div id="w-src0" class="src clip" data-start="0.6" data-duration="14.4" data-track-index="4"></div>
    <div id="w-src1" class="src clip" data-start="15" data-duration="15" data-track-index="4"></div>
  </div>
  <script>
    const F = window.FIG, A = F.a6, U = F.audit, R = F.runs.d1_on, C = R.check;
    const $ = (s) => document.querySelector(s);
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const n = (x) => x.toLocaleString("en-US");
    F.findings.forEach((f) => { const tr = el("tr"); tr.append(el("td", "code c", f.chain.join(", ")), el("td", "", f.title), el("td", "r", f.replays)); $("#w-find").append(tr); });
    [[n(U.chains), "chains tried"], [n(U.tool_calls), "tool calls run"], [U.calls, "Muse calls"], [n(U.tokens), "Muse tokens"], [U.seconds + " s", "wall clock"]]
      .forEach(([v, k]) => { const d = el("div"); d.append(el("div", "v", v), el("div", "k", k)); $("#w-stats").append(d); });
    $("#w-src0").append("Audit ", el("span", "code", U.file), ", commit ", el("span", "code", U.commit), `, ${U.model}, effort ${U.effort}, started ${U.started.slice(0, 19).replace("T", " ")} UTC.`);
    $("#w-pol").textContent = A.policy_ref;
    $("#w-rid").textContent = A.rule_id;
    $("#w-expr").textContent = "allow_if: " + A.allow_if;
    const [blk, tasks] = A.backtest.split("/");
    [["Blocked with A6", `${blk} of ${tasks}`], ["Blocked without A6", `${A.baseline_blocked} of ${tasks}`], ["Attack replayed", A.replay + " reached the forbidden goal"]]
      .forEach(([k, v], i) => { $("#w-bt").append(el("div", "k", k), el("div", "v" + (i < 2 ? " ok" : ""), v)); });
    const j = $("#w-json");
    const line = (k, v, last) => { j.append("  ", el("span", "k", `"${k}"`), `: "${v}"${last ? "" : ","}\n`); };
    j.append("{\n"); line("id", A.id); line("hole_key", A.hole_key); line("ratified_at", A.ratified_at, true); j.append("}");
    $("#w-via").textContent = `Ratified through ${A.ratified_via.split(", called")[0]}, the function the ratify endpoint calls. The DM2 builder agent made that call.`;
    [[C.t_call, C.tool + '(reason="…")', "proposed by Muse", "muse"], [C.t_check, "bylaw check", "denied, " + C.rule_id, "deny"], [R.wall_s, "end of run", "no vouchers issued", ""]]
      .forEach(([t, a, b, cls]) => { const tr = el("tr"); tr.append(el("td", "r", t.toFixed(3) + " s"), el("td", "code", a), el("td", cls, b)); $("#w-ev").append(tr); });
    $("#w-src1").append("Backtest and store ", el("span", "code", "reports/csdemo.json"), " and ", el("span", "code", A.store), ", event file ", el("span", "code", R.file), ".");

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#w-head", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
    const lit = (i, at) => {
      const muse = i < 2;
      tl.to("#w-s" + i, { opacity: 1, borderTopColor: muse ? "#c4a6ff" : "#f5f6ff", duration: 0.3, ease: "power2.out" }, at);
      if (i > 0) tl.to("#w-s" + (i - 1), { opacity: 0.7, borderTopColor: "rgba(220,223,242,.45)", duration: 0.3 }, at);
    };
    [0.4, 9.2, 15, 20, 25].forEach((at, i) => lit(i, at));
    tl.fromTo("#w-find tr", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.3 }, 1.0);
    tl.fromTo("#w-stats > div", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.25, ease: "power2.out" }, 4.0);
    tl.fromTo(["#w-pol", "#w-rid", "#w-expr"], { opacity: 0 }, { opacity: 1, duration: 0.35, stagger: 0.7 }, 9.5);
    tl.fromTo("#w-bt > div", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.2 }, 15.3);
    tl.fromTo(["#w-json", "#w-via"], { opacity: 0 }, { opacity: 1, duration: 0.35, stagger: 0.9 }, 20.3);
    tl.fromTo("#w-ev tr", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.7 }, 25.3);
    window.__timelines["how"] = tl;
  </script>
</template>
