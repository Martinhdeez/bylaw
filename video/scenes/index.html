<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0f1122; }
      #root { position: relative; width: 100%; height: 100%; background: #0f1122; }
    </style>
  </head>
  <body>
    <!-- VD4 generated beats, back to back. Each is cut out to its own MP4 by video/build.sh:
         hook 0-12 (B1), thesis 12-22 (B2), how 22-52 (B4), generality 52-70 (B7),
         measured 70-90 (B8), close 90-102 (B9). Durations match video/storyboard.md. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="102" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="thesis" data-composition-id="thesis" data-composition-src="compositions/thesis.html"
        data-start="12" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="how" data-composition-id="how" data-composition-src="compositions/how.html"
        data-start="22" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="generality" data-composition-id="generality" data-composition-src="compositions/generality.html"
        data-start="52" data-duration="18" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="measured" data-composition-id="measured" data-composition-src="compositions/measured.html"
        data-start="70" data-duration="20" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="close" data-composition-id="close" data-composition-src="compositions/close.html"
        data-start="90" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
