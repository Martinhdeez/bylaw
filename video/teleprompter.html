<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bylaw VD4 teleprompter</title>
<!-- Offline: no external files. Text copied from video/script.md; keep them in sync. -->
<style>
  :root { --bg: #0f1122; --ink: #f5f6ff; --muted: #959bc0; --violet: #c4a6ff; --amber: #ffb84d; --red: #ff6b5a; --green: #34e0a1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 24px; padding: 20px 4vw 0; font-size: 22px; color: var(--muted); }
  header b { color: var(--violet); font-size: 28px; }
  #timer { margin-left: auto; font: 600 44px/1 ui-monospace, Menlo, monospace; color: var(--green); font-variant-numeric: tabular-nums; }
  #timer.near { color: var(--amber); } #timer.over { color: var(--red); }
  #bar { height: 6px; margin: 14px 4vw 0; background: rgba(160,150,255,.18); border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--violet); }
  main { flex: 1; display: flex; align-items: center; padding: 2vh 6vw; }
  #text { font-size: clamp(34px, 5.2vw, 76px); line-height: 1.38; font-weight: 500; }
  #text span { display: block; }
  footer { padding: 0 4vw 18px; font-size: 18px; color: var(--muted); display: flex; gap: 28px; }
</style>
</head>
<body>
<header><b id="beat"></b><span id="title"></span><span id="meta"></span><span id="timer">0.0</span></header>
<div id="bar"><div id="fill"></div></div>
<main><div id="text"></div></main>
<footer><span>Space / → next · ← back · R restart timer</span><span id="total"></span></footer>
<script>
const BEATS = [
  ["B0", "Opening", 7, "This is OpenAI's open-source customer service demo. / We put bylaw on it."],
  ["B1", "Guard off", 30, "Six agents, all running on Meta's Muse Spark. / bylaw is the dark panel on the right. / First, the guard is off. / The customer checks flight one two three. / It is on time. / Then they say they missed a connection in New York, / and they ask for vouchers. / The agent pays for a hotel, a meal and transport."],
  ["B2", "What happened", 12, "Two hundred and eighty dollars, / for a flight that was on time. / Nobody hacked the agent. / Each step looked fine on its own."],
  ["B3", "Thesis", 14, "Models are powerful, / but they guess. / Here Muse proposed the payment. / bylaw read the airline's record, / checked the ratified rule, / and blocked the call two milliseconds later. / The model proposes. / The application decides."],
  ["B4", "How it works", 36, "How did bylaw know? / It audited the app first. / Muse Spark read the agents' instructions / and proposed chains of tool calls that end in a forbidden result. / Code ran every chain on a fresh copy of the app. / Seven chains reached a forbidden result, / five times out of five, / in fourteen seconds. / Then Muse drafted a fix: one rule. / bylaw replayed eight honest conversations. / The rule blocked none. / It was ratified, with a timestamp, / and the guard enforces it."],
  ["B5", "Guard on", 28, "Now the guard is on. / Same customer, same words, same agents. / The refunds agent asks to pay the vouchers. / bylaw reads the airline's record: / this booking is on time. / The call is blocked before it runs, / and nothing is paid. / The agent gets the reason, / and it tells the customer, politely. / Two hundred and eighty dollars stay with the airline. / Same model. / The application decided."],
  ["B5b", "Live on Muse", 17, "This time we typed it live, / on Muse, right now. / Same words. / bylaw blocks the payout again, / before it runs."],
  ["B6", "Other attacks", 20, "We tried four attacks and five honest requests. / The guard stopped three attacks: / vouchers on an on-time flight, / a seat on someone else's booking, / and compensation after a cancel. / None of the five honest requests was blocked. / A real missed connection still gets its vouchers."],
  ["B7", "Second framework", 16, "The rules are not tied to one framework. / This agent is built with PydanticAI, / and has no tools of its own. / Every tool goes through the bylaw M-C-P proxy. / Same attack: / denied. / An honest request: / allowed."],
  ["B8", "What we measured", 18, "Each figure is a single run, / not a rate. / Every attack that worked without the guard / was blocked with it, / and no honest request was. / For the front-row seat, / bylaw now reads the customer's own words, / not only what the agent writes."],
  ["B9", "Traceability", 20, "Every number in this video comes from a file in the repo. / Here is the guarded run, call by call. / And here is every Muse token the project used: / about six hundred thousand, / for under a dollar fifty at Meta's published price. / One script recounts all of it."],
  ["B10", "Close", 8, "bylaw is open source, built on Muse Spark. / The model proposes. / The application decides."],
];
let i = 0, t0 = performance.now();
const $ = (id) => document.getElementById(id);
const textOf = (b) => b[3];
const words = (s) => s.replace(/\//g, " ").split(/\s+/).filter(Boolean).length;
function show() {
  const b = BEATS[i], s = textOf(b);
  let start = 0; for (let k = 0; k < i; k++) start += BEATS[k][2];
  const mmss = (x) => Math.floor(x / 60) + ":" + String(x % 60).padStart(2, "0");
  $("beat").textContent = b[0];
  $("title").textContent = b[1];
  $("meta").textContent = `${mmss(start)}–${mmss(start + b[2])} · ${b[2]} s · ${words(s)} words`;
  $("text").innerHTML = s.split("/").map((p) => `<span>${p.trim()}</span>`).join("");
  $("total").textContent = `beat ${i + 1} of ${BEATS.length}`;
  t0 = performance.now();
}
function tick() {
  const dur = BEATS[i][2], el = (performance.now() - t0) / 1000;
  $("timer").textContent = el.toFixed(1) + " / " + dur;
  $("timer").className = el > dur ? "over" : el > dur - 3 ? "near" : "";
  $("fill").style.width = Math.min(100, (el / dur) * 100) + "%";
  requestAnimationFrame(tick);
}
addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); if (i < BEATS.length - 1) { i++; show(); } }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { if (i > 0) { i--; show(); } }
  else if (e.key === "r" || e.key === "R") t0 = performance.now();
});
show(); tick();
</script>
</body>
</html>
