<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0b0f" />
<title>Bylaw Scan and Fix</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
/* VZ1 prototype. Visual grammar: violet = the model proposes (fluid, curved, italic serif, soft edges);
   ink = the application decides (straight, ruled, monospace, square corners); green = allowed / ratified by a person;
   red = a hole; amber = class B. Tokens copied from web/src/styles.css (UI4). */
:root {
  --ground:#0b0b0f; --surface:#15151c; --step:#1e1e28; --raise:#282834;
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.2);
  --ink:#fbfbfd; --ink-2:#dddbe6; --muted:#bdbbca; --faint:#8f8da1;
  --violet:#9152ff; --violet-hi:#bd9bff; --violet-soft:rgba(145,82,255,.16); --v-edge:rgba(189,155,255,.5);
  --red:#ff5a3c; --red-soft:rgba(255,90,60,.13); --red-edge:rgba(255,90,60,.5);
  --green:#2be3a0; --green-soft:rgba(43,227,160,.12); --green-edge:rgba(43,227,160,.45);
  --amber:#ffb43a; --amber-soft:rgba(255,180,58,.13); --amber-edge:rgba(255,180,58,.5);
  --paper:#f3f1ea; --paper-ink:#0b0b12; --paper-muted:#55536a;
  --hole:#07090e; --trace:rgba(251,251,253,.075);
  --serif:"Source Serif 4",Georgia,serif; --display:"Archivo",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --tile-r:12px; color-scheme:dark;
}
:root[data-theme="light"] {
  --ground:#f1efe9; --surface:#fdfcf9; --step:#f4f2ec; --raise:#e9e6de;
  --line:rgba(20,18,30,.12); --line-2:rgba(20,18,30,.22);
  --ink:#15141b; --ink-2:#2e2c38; --muted:#4b4959; --faint:#6a6878;
  --violet:#6a2ee0; --violet-hi:#5b22cf; --violet-soft:rgba(106,46,224,.1); --v-edge:rgba(91,34,207,.5);
  --red:#c4300f; --red-soft:rgba(196,48,15,.09); --red-edge:rgba(196,48,15,.45);
  --green:#08774e; --green-soft:rgba(8,119,78,.09); --green-edge:rgba(8,119,78,.45);
  --amber:#965400; --amber-soft:rgba(201,120,0,.12); --amber-edge:rgba(150,84,0,.45);
  --paper:#fffdf4; --paper-ink:#15141b; --paper-muted:#5a5868;
  --hole:#15141b; --trace:rgba(20,18,30,.09); color-scheme:light;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--ground); color:var(--ink); font:400 15px/1.5 var(--display); -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
:focus-visible { outline:2px solid var(--violet-hi); outline-offset:2px; border-radius:8px; }
.mono { font-family:var(--mono); }

/* chrome */
.bar { display:flex; align-items:center; gap:16px; padding:16px 24px; flex-wrap:wrap; }
.lockup { display:flex; align-items:center; gap:10px; margin-right:8px; }
.lockup svg { width:30px; height:30px; color:var(--ink); }
.lockup b { font:800 22px/1 var(--display); letter-spacing:-.035em; }
.tiles { display:flex; gap:6px; padding:4px; border-radius:16px; background:var(--surface); border:1px solid var(--line); }
.tile { height:36px; padding:0 14px; border-radius:var(--tile-r); font-weight:600; font-size:14px; color:var(--muted); }
.tile:hover { color:var(--ink); background:var(--step); }
.tile[aria-pressed="true"] { color:var(--ink); background:var(--raise); box-shadow:inset 0 0 0 1px var(--line-2); }
.sq { width:36px; height:36px; display:grid; place-items:center; border-radius:var(--tile-r); background:var(--surface); border:1px solid var(--line); color:var(--muted); }
.sq:hover { color:var(--ink); border-color:var(--line-2); }
.grow { flex:1; }
.hint { font-size:12px; color:var(--faint); }

.wrap { padding:0 24px; }
.frame { position:relative; width:100%; max-width:1440px; margin:0 auto; border-radius:20px; overflow:hidden; background:var(--ground); border:1px solid var(--line); }
#stage { position:absolute; left:0; top:0; width:1280px; height:720px; transform-origin:0 0; overflow:hidden; }
#gfx { position:absolute; inset:0; width:1280px; height:720px; z-index:1; }
#layer { position:absolute; inset:0; z-index:2; pointer-events:none; }
#layer button { pointer-events:auto; }
.abs { position:absolute; }

/* in-stage title, actors and caption */
.s-title { position:absolute; left:40px; top:28px; font:600 26px/1.15 var(--serif); letter-spacing:-.01em; z-index:3; }
.s-title small { display:block; font:500 13px/1.4 var(--display); color:var(--faint); margin-top:4px; letter-spacing:0; }
.actors { position:absolute; right:40px; top:30px; display:flex; gap:18px; z-index:3; }
.actor { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); opacity:.38; transition:opacity .3s; }
.actor.on { opacity:1; color:var(--ink); }
.actor.off { opacity:.2; text-decoration:line-through; }
.actor i { width:14px; height:14px; flex:none; }
.actor.model i { border-radius:50%; background:var(--violet); box-shadow:0 0 0 4px var(--violet-soft); filter:blur(.4px); }
.actor.app i { border-radius:2px; background:var(--ink); }
.actor.human i { border-radius:3px; border:2px solid var(--green); }
.s-title, .cap { text-wrap:balance; }
.cap { position:absolute; left:40px; right:40px; bottom:26px; z-index:3; font:400 20px/1.4 var(--serif); color:var(--ink-2); max-width:1000px; min-height:28px; }
.cap.model { color:var(--violet-hi); font-style:italic; }
.cap-out { display:none; padding:16px 24px 0; font:400 17px/1.5 var(--serif); color:var(--ink-2); max-width:70ch; }

/* transport */
.transport { display:flex; align-items:center; gap:8px; padding:14px 24px 28px; flex-wrap:wrap; max-width:1488px; margin:0 auto; }
.play { width:44px; height:44px; border-radius:14px; background:var(--ink); color:var(--ground); display:grid; place-items:center; }
.chapters { display:flex; gap:4px; flex-wrap:wrap; }
.chap { height:32px; padding:0 12px; border-radius:10px; font-size:13px; color:var(--faint); border:1px solid transparent; }
.chap:hover { color:var(--ink); background:var(--surface); }
.chap[aria-current="step"] { color:var(--ink); border-color:var(--line-2); background:var(--surface); }
.chap b { font:500 11px var(--mono); margin-right:6px; color:var(--faint); }

/* paper (policy text) */
.paper { background:var(--paper); color:var(--paper-ink); border-radius:16px; padding:24px 28px 24px 64px; font:400 16.5px/1.6 var(--serif); box-shadow:0 18px 40px -18px rgba(0,0,0,.6); }
.paper .ph { font:500 12px var(--mono); color:var(--paper-muted); margin:0 0 14px -36px; }
.paper .cl { position:relative; margin-bottom:10px; }
.paper .cl::before { content:attr(data-n); position:absolute; left:-36px; top:3px; font:500 12px var(--mono); color:var(--paper-muted); }
.sen { background-image:linear-gradient(var(--violet-soft),var(--violet-soft)); background-repeat:no-repeat; background-size:0% 100%; border-radius:3px; padding:0 1px; }
:root:not([data-theme="light"]) .paper .sen { background-image:linear-gradient(rgba(145,82,255,.22),rgba(145,82,255,.22)); }
.sen.ink { background:none; text-decoration:underline 1.5px; text-underline-offset:4px; text-decoration-color:transparent; }
.sen.ink.done { text-decoration-color:var(--paper-ink); }
.sen.goal { box-shadow:0 0 0 1.5px var(--red); border-radius:4px; }
.ins { color:#08774e; text-decoration:underline 1.5px; text-underline-offset:4px; }
.ins.draft { color:#6a2ee0; font-style:italic; text-decoration:none; }
.paper.sm { font-size:14.5px; line-height:1.5; padding-top:20px; }
.paper.sm .cl { margin-bottom:4px; }
.paper.sm .ah { margin-top:8px; }
.find.cmp { padding:10px 14px; margin-bottom:8px; }
.find.cmp .r1 { display:flex; justify-content:space-between; align-items:baseline; }
.find.cmp .m { font-size:16px; }
.gate text { paint-order:stroke; stroke:var(--ground); stroke-width:6px; stroke-linejoin:round; }
.label { display:inline-block; font:500 11px var(--mono); padding:2px 6px; border-radius:4px; border:1px solid currentColor; }

/* rule blocks: the application's register */
.rules h3, .panel h3 { font:600 18px/1.2 var(--serif); margin-bottom:4px; }
.sub { font-size:13px; color:var(--faint); margin-bottom:14px; }
.rule { position:relative; padding:8px 12px; border-radius:4px; border:1px solid var(--line-2); background:var(--surface); margin-bottom:8px; font:400 12px/1.5 var(--mono); opacity:0; }
.rule b { font-weight:700; color:var(--ink); }
.rule .t { color:var(--faint); margin-left:8px; }
.rule .x { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rule.prop { border:1px dashed var(--v-edge); background:var(--violet-soft); border-radius:14px; font-family:var(--serif); font-style:italic; color:var(--violet-hi); }
.rule.prop .x { filter:blur(2.2px); }
.more { font:500 12px var(--mono); color:var(--faint); opacity:0; }
.fly { position:absolute; z-index:5; padding:4px 12px; border-radius:999px; background:var(--violet-soft); border:1px solid var(--v-edge); color:var(--violet-hi); font:italic 400 14px var(--serif); white-space:nowrap; pointer-events:none; }
.stamp { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:4px; border:1.5px solid currentColor; font:700 12px var(--mono); }
.score { opacity:0; }
.score b { font:600 32px var(--display); letter-spacing:-.02em; margin-right:8px; }

/* graph (svg) */
.node rect { fill:var(--surface); stroke:var(--line-2); }
.node text { font:500 12px var(--mono); fill:var(--ink-2); }
.node.hot rect { stroke:var(--ink); stroke-width:1.5; }
.colh { font:500 12px var(--display); fill:var(--faint); }
.ring { fill:var(--hole); stroke:var(--line-2); stroke-width:2; }
.ring.lit { stroke:var(--red); fill:var(--red-soft); stroke-width:3; }
.ring.amber { stroke:var(--amber); stroke-width:3; }
.ring.safe { stroke:var(--green); stroke-width:3; }
.glab { font:500 12px var(--mono); fill:var(--muted); }
.glab tspan { fill:var(--faint); font-family:var(--display); }
.tr { fill:none; stroke:var(--trace); stroke-width:1; }
.tmpl { fill:none; stroke:var(--violet); stroke-width:2; stroke-linecap:round; opacity:.9; }
.exe { fill:none; stroke:var(--ink); stroke-width:1.4; opacity:.55; }
.hero { fill:none; stroke:var(--ink); stroke-width:3; stroke-linejoin:round; }
.hero.red { stroke:var(--red); }
.hero.amber { stroke:var(--amber); }
.hero.cut { stroke-dasharray:4 6; opacity:.35; }
.crack { fill:none; stroke:var(--red); stroke-width:3; stroke-linejoin:round; }
.dot { fill:var(--ink); }
.gate rect { fill:var(--ink); }
.gate text { font:700 12px var(--mono); fill:var(--ink); }

/* panel cards */
.card { border-radius:16px; background:var(--surface); border:1px solid var(--line); padding:16px 18px; }
.call { font:400 12.5px/1.55 var(--mono); color:var(--ink-2); min-height:40px; }
.call b { color:var(--ink); font-weight:700; }
.stamps { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; min-height:26px; }
.ok { font:600 11px var(--mono); padding:3px 7px; border-radius:4px; color:var(--green); border:1px solid var(--green-edge); background:var(--green-soft); opacity:0; }
.ok.note { color:var(--ink-2); border-color:var(--line-2); background:var(--step); }
.obj-h { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }
.obj-h b { font:700 15px var(--mono); }
.obj-h span { font-size:12px; color:var(--faint); }
.pill { display:inline-block; font:600 12px var(--mono); padding:2px 8px; border-radius:999px; border:1px solid var(--line-2); }
.pill.bad { color:var(--red); border-color:var(--red-edge); background:var(--red-soft); }
.ledger { display:grid; grid-template-columns:1fr 1fr; gap:14px; position:relative; margin-top:12px; }
.col h4 { font:600 12px var(--display); color:var(--faint); margin-bottom:6px; }
.stack { display:flex; flex-direction:column-reverse; gap:4px; height:126px; position:relative; }
.chip { height:27px; border-radius:4px; display:flex; align-items:center; justify-content:space-between; padding:0 8px; font:500 11px var(--mono); background:var(--step); border:1px solid var(--line-2); }
.chip.ref { border-color:var(--line-2); }
.chip.flag { border-color:var(--red-edge); background:var(--red-soft); color:var(--red); }
.chip.src { box-shadow:0 0 0 2px var(--ink); }
.thresh { position:absolute; left:-6px; right:-6px; height:0; border-top:1.5px dashed var(--faint); bottom:0; transition:none; }
.thresh span { position:absolute; left:6px; top:-17px; font:500 10.5px var(--mono); color:var(--faint); }
.bal { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:12px; color:var(--faint); }
.bal b { font:700 22px var(--mono); color:var(--ink); }
.cond { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:4px; border:1px solid var(--line); margin-top:6px; font-size:13px; color:var(--faint); }
.cond i { width:12px; height:12px; border-radius:50%; border:2px solid var(--line-2); flex:none; }
.cond.on { color:var(--ink); border-color:var(--red-edge); }
.cond.on i { background:var(--red); border-color:var(--red); }
.frow { display:flex; justify-content:space-between; font:500 12.5px var(--mono); padding:4px 0; border-bottom:1px solid var(--line); }
.frow .d.chg { color:var(--red); }
.seals { display:flex; gap:8px; align-items:center; }
.seal { width:34px; height:34px; border-radius:6px; border:1.5px solid var(--ink); display:grid; place-items:center; font:700 13px var(--mono); opacity:0; }
.verdict { font:600 40px/1.05 var(--serif); letter-spacing:-.02em; }
.verdict.red { color:var(--red); } .verdict.amber { color:var(--amber); }
.small { font-size:13px; color:var(--muted); line-height:1.5; }
.grid-g { display:grid; gap:4px; }
.gt { aspect-ratio:1; border-radius:3px; background:var(--step); border:1px solid var(--line); font:500 9.5px var(--mono); display:grid; place-items:center; color:var(--faint); }
.gt.chk { border-color:var(--line-2); color:var(--muted); }
.gt.hit { border-color:var(--amber); background:var(--amber-soft); color:var(--amber); }

/* trays */
.tray { border-radius:16px; border:1px solid var(--line); background:var(--surface); padding:18px; display:flex; flex-direction:column; }
.tray .L { font:600 56px/1 var(--serif); }
.tray.A .L { color:var(--red); } .tray.B .L { color:var(--amber); } .tray.C .L { color:var(--muted); }
.tray h4 { font:600 17px var(--serif); margin-top:6px; }
.tray p { font-size:13px; color:var(--faint); margin:4px 0 12px; min-height:20px; }
.tray .n { font:700 14px var(--mono); color:var(--ink-2); }
.find { border-radius:12px; padding:12px 14px; border:1px solid var(--red-edge); background:var(--red-soft); opacity:0; }
.find.c { border-color:var(--line-2); background:var(--step); }
.find b { font:700 13px var(--mono); display:block; }
.find span { font-size:13px; color:var(--muted); }
.find .m { font:700 20px var(--mono); color:var(--red); }
.btile { font:600 10.5px var(--mono); padding:3px 5px; border-radius:4px; border:1px solid var(--amber-edge); background:var(--amber-soft); color:var(--amber); opacity:0; }
.csq { width:11px; height:11px; border-radius:2px; background:var(--raise); border:1px solid var(--line-2); opacity:0; }
.grp { font:500 11px var(--mono); color:var(--faint); margin:8px 0 4px; }
.empty { font:italic 400 15px/1.5 var(--serif); color:var(--faint); padding:12px 0; }

/* fix */
.ticket { border-radius:8px; border:1px solid var(--line); background:var(--surface); padding:8px 10px; height:58px; position:relative; }
.ticket b { font:600 12px var(--mono); color:var(--ink-2); }
.ticket svg { position:absolute; left:10px; right:10px; bottom:10px; width:calc(100% - 20px); height:14px; overflow:visible; }
.ticket.blk { border-color:var(--amber-edge); background:var(--amber-soft); }
.ticket.blk b { color:var(--amber); }
.ticket .tag { position:absolute; right:8px; top:8px; font:600 10px var(--mono); color:var(--amber); opacity:0; }
.claim { border-left:3px solid var(--violet); padding:6px 0 6px 14px; font:italic 400 16px/1.5 var(--serif); color:var(--violet-hi); opacity:0; }
.fact { border-left:3px solid var(--ink); padding:6px 0 6px 14px; font:400 15px/1.5 var(--display); opacity:0; }
.ratify { height:48px; padding:0 28px; border-radius:999px; background:var(--green); color:#062b1d; font-weight:700; font-size:16px; }
.ratify[disabled] { opacity:.5; cursor:default; }
.big-stamp { position:absolute; font:800 34px/1 var(--display); letter-spacing:.02em; color:var(--green); border:4px solid var(--green); border-radius:8px; padding:10px 18px; transform:rotate(-7deg); opacity:0; }
.side h3 { font:600 22px var(--serif); }
.lane-lab { font:500 12px var(--mono); fill:var(--muted); }
.pkt { font:500 11.5px var(--mono); padding:5px 10px; border-radius:999px; background:var(--violet-soft); border:1px solid var(--v-edge); color:var(--violet-hi); white-space:nowrap; opacity:0; }
.pkt.stopped { border-radius:4px; background:var(--surface); border-color:var(--ink); color:var(--ink); }
.refuse { font:700 12px var(--mono); color:var(--ink); border:1.5px solid var(--ink); border-radius:4px; padding:4px 8px; background:var(--ground); opacity:0; }

/* csdemo */
.paper .ah { font:600 12.5px var(--mono); color:var(--paper-muted); margin:12px 0 4px; }
.g-cs .node text { font-size:11px; }
.chat { display:flex; flex-direction:column; padding:14px 14px 10px; }
.chat-h { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px; }
.chat-h b { font:600 16px var(--serif); }
.clk { font-size:12px; color:var(--faint); }
.who { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--violet-hi); margin-bottom:8px; }
.who i { width:9px; height:9px; border-radius:50%; background:var(--violet); box-shadow:0 0 0 3px var(--violet-soft); }
.msgs { flex:1; overflow:hidden; display:flex; flex-direction:column; gap:8px; }
.msgs > :first-child { margin-top:auto; }
.bub { font-size:13px; line-height:1.45; padding:8px 12px; border-radius:14px; max-width:92%; flex:none; }
.bub.u { align-self:flex-end; background:var(--raise); border-bottom-right-radius:4px; }
.bub.a { align-self:flex-start; background:var(--violet-soft); color:var(--ink-2); border-bottom-left-radius:4px; font-family:var(--serif); font-size:14px; }
.bub .an { display:block; font:600 11px var(--display); color:var(--violet-hi); margin-bottom:2px; }
.agsvg { width:100%; height:300px; display:block; }
.hedge { stroke:var(--line); stroke-width:1; }
.harc { fill:none; stroke:var(--violet); stroke-width:2.5; stroke-linecap:round; }
.agent circle { fill:var(--step); stroke:var(--v-edge); stroke-width:1.5; transition:fill .3s; }
.agent text { font:500 11px var(--display); fill:var(--faint); }
.agent.on circle { fill:var(--violet); stroke:var(--violet-hi); }
.agent.on text { fill:var(--ink); }
.lane { display:flex; flex-direction:column; padding:14px; }
.rows { flex:1; overflow:hidden; display:flex; flex-direction:column; gap:6px; }
.lrow { border:1px solid var(--line-2); border-radius:4px; padding:6px 8px; font:400 11.5px/1.45 var(--mono); flex:none; }
.lrow > div:first-child { display:flex; justify-content:space-between; gap:8px; }
.lrow .tl { font-weight:700; color:var(--ink); }
.lrow .ar { color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lrow .out { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-top:1px solid var(--line); margin-top:4px; padding-top:4px; }
.lrow .out.bmsg { white-space:normal; color:var(--ink); font-weight:700; }
.lrow.blocked { border:2px solid var(--ink); }
.vd { font:700 10.5px var(--mono); padding:1px 6px; border-radius:3px; }
.vd.ok2 { color:var(--green); border:1px solid var(--green-edge); background:var(--green-soft); }
.vd.blk { color:var(--ground); background:var(--ink); }
.cfly { font:500 11px var(--mono); font-style:normal; }
.st { padding:14px 16px; }
.srow { display:flex; justify-content:space-between; gap:12px; font:500 12px var(--mono); padding:3px 0; border-bottom:1px solid var(--line); }
.srow > span:first-child { color:var(--faint); }
.srow .v { color:var(--ink-2); text-align:right; }
.srow .v.bad { color:var(--red); font-weight:700; }

/* ───────────── the graph: tools as nodes, chains as paths, forbidden goals as the logo's hole ring ───────────── */
const GX = { sx: 110, sy: 360 };
const geo = D => D.geo || { cols: [300, 610], w: 236, gx: 1000 };
const ty = (i, n) => 360 + (i - (n - 1) / 2) * 62;
const gy = (j, m) => 360 + (j - (m - 1) / 2) * 56;
// chain = tool index per column; every step is an elbow from the gap before its column
function orth(D, chain, g, j = 0) {
  const { cols, w, gx } = geo(D), T = D.tools.length;
  let d = `M${GX.sx} ${GX.sy}`;
  chain.forEach((t, c) => { d += ` H${cols[c] - 45 + j} V${ty(t, T)} H${cols[c] + w}`; });
  return d + ` H${gx - 75 + j} V${gy(g, D.goals.length)} H${gx - 17}`;
}
function curve(D, chain, g, R) {
  const { cols, w, gx } = geo(D), T = D.tools.length, k = () => (R() - .5) * 70;
  let d = `M${GX.sx} ${GX.sy}`, px = GX.sx, py = GX.sy;
  for (const [c, t] of chain.entries()) { const y = ty(t, T); d += ` C${px + 70 + k()} ${py + k()} ${cols[c] - 70 + k()} ${y + k()} ${cols[c]} ${y} H${cols[c] + w}`; px = cols[c] + w; py = y; }
  const yg = gy(g, D.goals.length);
  return d + ` C${px + 70 + k()} ${py + k()} ${gx - 90 + k()} ${yg + k()} ${gx - 17} ${yg}`;
}
function segs(D, chain, g) {
  const { cols, w, gx } = geo(D), T = D.tools.length, out = [];
  let px = GX.sx, py = GX.sy;
  for (const [c, t] of chain.entries()) { const y = ty(t, T); out.push(`M${px} ${py} H${cols[c] - 45} V${y} H${cols[c] + w}`); px = cols[c] + w; py = y; }
  out.push(`M${px} ${py} H${gx - 75} V${gy(g, D.goals.length)} H${gx - 17}`);
  return out;
}
const CRACK = [[122,6],[109.3,12.7],[107.5,25.3],[92,33.6],[90,47.9],[73.5,57.3],[66.2,73],[52.3,76.6],[45.5,94.7],[31,101.9],[22,118]];
const crackD = (cx, cy, s) => 'M' + CRACK.map(([x, y]) => `${(cx + (x - 65) * s).toFixed(1)} ${(cy + (y - 72.6) * s).toFixed(1)}`).join(' L');

function buildGraph(D, parent = gfx) {
  const { cols, w, gx } = geo(D);
  const g = sv('g', { class: D.key === 'cs' ? 'g-cs' : '' }, parent);
  const tr = sv('g', {}, g);           // traces under the nodes
  const top = sv('g', {}, g);          // templates, hero path
  const nodes = sv('g', {}, g);
  const T = D.tools.length, M = D.goals.length;
  cols.forEach((x, c) => { sv('text', { x, y: ty(0, T) - 28, class: 'colh' }, nodes).textContent = c ? `Step ${c + 1}` : 'Step 1, a write tool'; });
  sv('text', { x: gx - 16, y: gy(0, M) - 30, class: 'colh' }, nodes).textContent = 'Forbidden goal';
  const start = sv('g', { class: 'node' }, nodes);
  sv('circle', { cx: GX.sx, cy: GX.sy, r: 9, fill: 'var(--ink)' }, start);
  sv('text', { x: GX.sx - 26, y: GX.sy - 20, class: 'colh' }, start).textContent = D.key === 'cs' ? 'fresh session' : 'fresh database';
  const tn = cols.map(() => []);
  cols.forEach((x, c) => D.tools.forEach((t, i) => {
    const n = sv('g', { class: 'node' }, nodes);
    sv('rect', { x, y: ty(i, T) - 16, width: w, height: 32, rx: 4 }, n);
    sv('text', { x: x + 12, y: ty(i, T) + 4 }, n).textContent = t;
    tn[c].push(n);
  }));
  const rings = D.goals.map(([id, name], j) => {
    const r = sv('circle', { cx: gx, cy: gy(j, M), r: 15, class: 'ring' }, nodes);
    const t = sv('text', { x: gx + 26, y: gy(j, M) + 4, class: 'glab' }, nodes);
    t.innerHTML = `${id} <tspan dx="4">${name.replace(/_/g, ' ')}</tspan>`;
    return r;
  });
  return { g, tr, top, nodes, tn, rings, all: [start, ...tn.flat(), ...rings] };
}
function traceList(D, n) {
  const R = rng(11), tot = D.goalW.reduce((a, b) => a + b, 0), out = [], C = geo(D).cols.length;
  for (let i = 0; i < n; i++) {
    let x = R() * tot, g = 0; while (x > D.goalW[g]) x -= D.goalW[g++];
    out.push([Array.from({ length: C }, () => Math.floor(R() * D.tools.length)), g, Math.round((R() - .5) * 22)]);
  }
  return out.sort((a, b) => a[0][0] * 100 + a[0][1] - (b[0][0] * 100 + b[0][1]));
}
const nTraces = D => D.per ? Math.round(D.chains / D.per) : 180;
function fillTraces(D, G, opacity) {
  for (const [ch, g, j] of traceList(D, nTraces(D))) sv('path', { d: orth(D, ch, g, j), class: 'tr', style: opacity ? `opacity:${opacity}` : '' }, G.tr);
}

async function sCompile() {
  const d = D();
  title('The policy becomes rules', d.compileSub);
  const paper = at(el('div', 'paper' + (d.key === 'cs' ? ' sm' : '')), 40, 96, 600, 520);
  el('div', 'ph', d.docHead, paper);
  const sens = [];
  for (const c of d.doc) {
    if (c.h) el('div', 'ah', c.h, paper);
    const cl = el('div', 'cl', '', paper); cl.dataset.n = c.n || '';
    for (const s of c.s) { const sp = el('span', 'sen' + (d.muse ? '' : ' ink'), esc(s.t), cl); cl.append(' '); sens.push([sp, s]); }
  }
  const col = at(el('div', 'rules'), 680, 96, 560);
  el('h3', '', 'RuleSet', col);
  el('div', 'sub', d.ruleSub, col);
  const blocks = {};
  for (const [, s] of sens) if (s.r) {
    const [tool, expr] = d.rules[s.r];
    blocks[s.r] = el('div', 'rule' + (d.muse ? ' prop' : ''), `<div><b>${s.r}</b><span class="t">${tool}</span></div><div class="x">allow_if ${esc(expr)}</div>`, col);
  }
  const more = el('div', 'more', d.ruleCount ? `+ ${d.ruleCount - Object.keys(blocks).length} more rules` : '+ more rules', col);
  const goals = at(el('div', ''), 680, 560, 560); goals.style.display = 'flex'; goals.style.gap = '10px'; goals.style.flexWrap = 'wrap';
  const gEls = d.goals.map(([id]) => { const g = el('span', 'stamp', `<svg width="14" height="14" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="var(--hole)" stroke="currentColor" stroke-width="3"/></svg>${id}`, goals); g.style.opacity = 0; g.style.color = 'var(--muted)'; return g; });

  await W(500);
  if (d.muse) {
    say('Muse Spark reads the policy and proposes a rule for each sentence it can act on.', 'model');
    let k = 0;
    for (const [sp, s] of sens) {
      if (!s.r) continue;
      const slow = k++ < 2, b = blocks[s.r];
      await A(sp, [{ backgroundSize: '0% 100%' }, { backgroundSize: '100% 100%' }], slow ? 700 : 300, { ease: 'ease-in-out' });
      const from = rel(sp), to = rel(b);
      const f = at(el('div', 'fly', esc(s.t.slice(0, 44)) + '…'), from.x, from.y);
      await A(f, [{ transform: 'translate(0,0) rotate(0)', opacity: .2 }, { transform: `translate(${(to.x - from.x) * .5}px, ${(to.y - from.y) * .5 - 70}px) rotate(-3deg)`, opacity: 1, offset: .5 }, { transform: `translate(${to.x - from.x}px, ${to.y - from.y}px) rotate(0)`, opacity: .9 }], slow ? 1100 : 600, { ease: 'cubic-bezier(.45,.05,.3,1)' });
      f.remove();
      await fadeIn(b, slow ? 300 : 160);
    }
    await W(600);
    say('Bylaw does not take the proposal on trust. It scores it against the hand RuleSet, and enforces rules whose expressions it can check.', 'app');
    let j = 0;
    for (const b of Object.values(blocks)) { b.classList.remove('prop'); snap(b, j++ * 120).catch(() => {}); }
    await W(j * 120 + 300);
    fadeIn(more, 300).catch(() => {});
    const sc = at(el('div', 'score', d.score), 680, 482, 560);
    await snap(sc);
  } else {
    say('Each rule quotes the sentence it enforces. The expression is ordinary code that Bylaw evaluates the same way every time.', 'app');
    for (const [sp, s] of sens) {
      if (!s.r) continue;
      sp.classList.add('done');
      await A(blocks[s.r], [{ opacity: 0, transform: 'translateX(14px)' }, { opacity: 1, transform: 'none' }], 260, { ease: 'cubic-bezier(.2,0,0,1)' });
      await W(160);
    }
    await fadeIn(more, 300);
  }
  await W(900);
  say('The forbidden goals are written by hand and frozen before any search runs. Each one names an outcome the text rules out.', 'app');
  for (const [sp, s] of sens) if (s.g) sp.classList.add('goal');
  for (const [i, g] of gEls.entries()) snap(g, i * 90).catch(() => {});
  await W(gEls.length * 90 + 1600);
}

async function sSearch() {
  const d = D();
  title('Search: chains of allowed calls', d.searchSub);
  const G = buildGraph(d);
  for (const [i, n] of G.all.entries()) fadeIn(n, 300, i * 25).catch(() => {});
  await W(G.all.length * 25 + 500);
  if (d.muse) {
    const n = d.templates.length;
    say(`Muse Spark writes one chain template per forbidden goal: ${n} calls, a guess for each.`, 'model');
    const R = rng(5), tm = [];
    for (const [i, [ch, g]] of d.templates.entries()) { const p = sv('path', { d: curve(d, ch, g, R), class: 'tmpl' }, G.top); tm.push([p, ch, g]); draw(p, 1200, i * 220).catch(() => {}); }
    await W(n * 220 + 1400);
    say(`Bylaw executes every template in a fresh ${d.sim}, as straight, checked steps. Templates get at most half the budget.`, 'app');
    for (const [i, [p, ch, g]] of tm.entries()) {
      A(p, [{ opacity: .9 }, { opacity: .18 }], 500, { delay: i * 160 }).catch(() => {});
      draw(sv('path', { d: orth(d, ch, g), class: 'exe' }, G.top), 600, i * 160).catch(() => {});
    }
    await W(n * 160 + 900);
  }
  say(d.bfsSay, 'app');
  const list = traceList(d, nTraces(d)), stag = d.muse ? 16 : 14;
  list.forEach(([ch, g, j], i) => draw(sv('path', { d: orth(d, ch, g, j), class: 'tr' }, G.tr), 260, i * stag).catch(() => {}));
  const h = d.hero, hp = sv('path', { d: orth(d, h.chain, h.g), class: 'hero red', style: 'opacity:0' }, G.top);
  if (h.foundAt) {
    await W(Math.round(list.length * h.foundAt / d.calls) * stag + 500);
    hp.style.opacity = 1; await draw(hp, 500);
    G.rings[h.g].classList.add('lit');
    const t = sv('text', { x: geo(d).gx - 150, y: gy(h.g, d.goals.length) + 34, class: 'glab' }, G.top);
    t.textContent = `reached at tool call ${h.foundAt}, ${h.foundSecs} s`;
    await W(1200);
    A(hp, [{ opacity: 1 }, { opacity: .35 }], 600).catch(() => {});
  }
  await W(list.length * stag + 300);
  if (!h.foundAt && d.key === 'cs') { hp.style.opacity = 1; await draw(hp, 700); G.rings[h.g].classList.add('lit'); say('One chain reaches D1: check an on-time flight, mention Paris, ask for compensation.', 'app'); await W(1400); }
  const strip = at(el('div', ''), 40, 600, 1200); strip.style.cssText += 'display:flex;gap:28px;font:500 13px var(--mono);color:var(--muted)';
  const items = d.stats;
  items.forEach((s, i) => { const e = el('span', '', s, strip); e.style.opacity = 0; fadeIn(e, 300, i * 120).catch(() => {}); });
  await W(2200);
}

function execGraph(d) {
  const G = buildGraph(d);
  G.g.setAttribute('transform', d.key === 'cs' ? 'translate(4 150) scale(.6)' : 'translate(10 150) scale(.6)');
  fillTraces(d, G, .55);
  return G;
}
async function heroRun(d, G, steps) {
  const h = d.hero, ps = segs(d, h.chain, h.g).map(p => sv('path', { d: p, class: 'hero' }, G.top));
  const dot = sv('circle', { r: 7, class: 'dot', cx: GX.sx, cy: GX.sy }, G.top);
  const along = (p, ms) => { const L = p.getTotalLength(); return Promise.all([draw(p, ms), tween(ms, k => { const q = p.getPointAtLength(k * L); dot.setAttribute('cx', q.x); dot.setAttribute('cy', q.y); }, t => t)]); };
  for (const [i, p] of ps.entries()) {
    await along(p, i < h.chain.length ? 900 : 700);
    if (i < h.chain.length) G.tn[i][h.chain[i]].classList.add('hot');
    await steps[i]();
  }
  return { segs: ps, dot };
}
async function replay5(d, G, panel, y) {
  say(`Bylaw replays the chain five times, each on a fresh ${d.key === 'cs' ? 'session' : 'database'}, with no model. Same calls, same diff: 5/5.`, 'app');
  const row = at(el('div', 'seals', '<span class="small" style="margin-right:6px">replays</span>', panel), 0, y); row.style.position = 'relative';
  const full = sv('path', { d: orth(d, d.hero.chain, d.hero.g), fill: 'none', stroke: 'none' }, G.top), L = full.getTotalLength();
  for (let i = 1; i <= 5; i++) {
    const ghost = sv('circle', { r: 5, fill: 'var(--ink)', opacity: .7 }, G.top);
    await tween(420, k => { const q = full.getPointAtLength(k * L); ghost.setAttribute('cx', q.x); ghost.setAttribute('cy', q.y); }, t => t);
    ghost.remove();
    const s = el('span', 'seal', String(i), row); await snap(s);
  }
  const fin = el('b', 'mono', '5/5', row); fin.style.cssText = 'font-size:20px;margin-left:8px;color:var(--green)';
  await snap(fin);
}

async function sVerdict() {
  const d = D();
  title('Classify: hole, contradiction or ambiguity', 'Does the benchmark itself do this?');
  const G = execGraph(d), h = d.hero;
  const hp = sv('path', { d: orth(d, h.chain, h.g), class: 'hero' }, G.top);
  G.rings[h.g].classList.add('lit');
  const P = at(el('div', 'card'), 790, 96, 450);
  P.innerHTML = `<h3 style="font:600 18px var(--serif)">Gold tasks that reach ${d.goals[h.g][0]}</h3><div class="sub">${d.gold} tasks of the benchmark, each a known-correct trajectory, replayed by Bylaw.</div>`;
  const grid = el('div', 'grid-g', '', P); grid.style.gridTemplateColumns = `repeat(${d.muse ? 9 : 14}, 1fr)`;
  const tiles = Array.from({ length: d.gold }, (_, i) => el('div', 'gt', d.goldIds ? d.goldIds[i] : '', grid));
  await W(400);
  say(`Bylaw asks one question of the ${d.gold} gold tasks: does any of them reach the same goal?`, 'app');
  const hit = d.muse ? d.goldIds.indexOf('32') : -1;

// The session state object (AirlineAgentContext) with the D1 meter.
function stateCard(parent, compact) {
  const c = el('div', 'card st' + (compact ? ' compact' : ''), '', parent);
  const rows = [['passenger_name', 'passenger'], ['confirmation_number', 'confirmation'], ['flight_number', 'flight'], ['seat_number', 'seat'], ['scenario', 'scenario'], ['compensation_case_id', 'case'], ['vouchers', 'vouchers']];
  c.innerHTML = `<div class="obj-h"><b>Session state</b><span>AirlineAgentContext</span></div>` +
    rows.map(([k, l]) => `<div class="srow" data-k="${k}"><span>${l}</span><span class="v">null</span></div>`).join('') +
    `<div class="meter-d1"><svg class="d1ring" viewBox="0 0 40 40" width="34" height="34"><circle cx="20" cy="20" r="12" class="ring"/><path class="crack" style="opacity:0" d="${crackD(20, 20, .26)}"/></svg>
      <div class="d1t"><b class="mono">D1</b><div class="conds"><span class="cnd" data-c="ontime">booked flight on time</span><span class="cnd" data-c="vouch">vouchers set</span></div></div><b class="tot mono"></b></div>`;
  const val = k => $(`[data-k="${k}"] .v`, c);
  const s = {};
  return {
    el: c,
    async apply(diff, quiet) {
      for (const [k, v] of Object.entries(diff)) {
        s[k] = v;
        const e = val(k);
        e.textContent = k === 'flight_number' ? `${v}, on time` : k === 'vouchers' ? VOUCH.map(([n, a]) => `$${a} ${n}`).join(', ') : v;
        e.classList.toggle('bad', k === 'vouchers' || (k === 'scenario' && v === 'disrupted'));
        if (!quiet) await snap(e);
      }
      if (s.flight_number) $('[data-c="ontime"]', c).classList.add('on');
      if (s.vouchers) {
        $('[data-c="vouch"]', c).classList.add('on'); $('.tot', c).textContent = '$280';
        $('.d1ring .ring', c).classList.add('lit');
        const ck = $('.d1ring .crack', c); ck.style.opacity = 1; if (!quiet) await draw(ck, 600);
        c.classList.add('hit');
        return true;
      }
    },
  };
}

// chat + agent graph (full only) + Bylaw lane + state. Plays CS-C3-shaped events on the scene clock.
function liveConv(x, y, w, h, o) {
  const root = at(el('div', 'live' + (o.compact ? ' compact' : '')), x, y, w, h);
  const cw = o.compact ? 262 : 380;
  const chat = at(el('div', 'card chat', `<div class="chat-h"><b>Customer chat</b><span class="mono clk">t 0.0 s</span></div><div class="who"></div><div class="msgs"></div>`, root), 0, 0, cw, h);
  const msgs = $('.msgs', chat), clk = $('.clk', chat), who = $('.who', chat);
  const nodes = {}; let gsvg = null;
  if (!o.compact) {
    const mid = at(el('div', 'card agents', `<div class="chat-h"><b>Agents</b><span class="small">handoffs, as the model routes</span></div>`, root), cw + 20, 0, 380, 352);
    gsvg = document.createElementNS(NS, 'svg'); gsvg.setAttribute('viewBox', '0 0 360 330'); gsvg.setAttribute('class', 'agsvg'); mid.appendChild(gsvg);
    for (const [a, b] of HANDOFFS) sv('line', { x1: AG[a][1], y1: AG[a][2], x2: AG[b][1], y2: AG[b][2], class: 'hedge' }, gsvg);
    for (const [k, [name, ax, ay]] of Object.entries(AG)) {
      const g = sv('g', { class: 'agent' }, gsvg);
      sv('circle', { cx: ax, cy: ay, r: 16 }, g);
      sv('text', { x: ax, y: ay + 32, 'text-anchor': 'middle' }, g).textContent = name;
      nodes[k] = g;
    }
  }
  const rx = o.compact ? cw + 12 : cw + 420, rw = w - rx;
  const right = at(el('div', '', '', root), rx, 0, rw);
  const lane = el('div', 'card lane', `<div class="chat-h"><b>Bylaw lane</b><span class="small">${o.guard ? 'guard on, checked before it runs' : 'guard off, checked, not enforced'}</span></div><div class="rows"></div>`, right);
  lane.style.height = o.compact ? '226px' : '232px';
  const rows = $('.rows', lane);
  const state = stateCard(right, o.compact); state.el.style.marginTop = '12px';
  if (o.init) state.apply(o.init, true);
  const meter = o.compact ? null : at(el('div', 'card bigmeter', '', root), cw + 20, 366, 380, h - 366);
  const setActive = k => { for (const [n, g] of Object.entries(nodes)) g.classList.toggle('on', n === k); who.innerHTML = `<i></i>${AG[k][0]} Agent`; return k; };
  let active = setActive(o.start || 'TR');
  const bubble = (cls, html) => { const b = el('div', 'bub ' + cls, html, msgs); return pop(b, 260); };
  return {
    root, state, meter,
    async play(events, cap = {}, k = .5) {
      let now = 0, hit = false;
      for (const [i, ev] of events.entries()) {
        const due = ev[1] * 1000 * k;
        if (due > now) { await W(due - now); now = due; }
        clk.textContent = `t ${ev[1].toFixed(1)} s`;
        if (cap[i]) say(...cap[i]);
        const type = ev[0];
        if (type === 'u') await bubble('u', esc(ev[2]));
        else if (type === 'm') await bubble('a', `<span class="an">${AG[ev[2]][0]}</span>${esc(ev[3])}`);
        else if (type === 'h') {
          if (gsvg) {
            const [, ax, ay] = AG[ev[2]], [, bx, by] = AG[ev[3]];
            const p = sv('path', { d: `M${ax} ${ay} Q${(ax + bx) / 2 + (by - ay) * .3} ${(ay + by) / 2 - (bx - ax) * .3} ${bx} ${by}`, class: 'harc' }, gsvg);
            await draw(p, 500); A(p, [{ opacity: 1 }, { opacity: .3 }], 900).catch(() => {});
            now += 500;
          }
          active = setActive(ev[3]);
        } else if (type === 'c') {
          const src = gsvg ? nodes[active].firstChild : who;
          const row = el('div', 'lrow', `<div><span class="tl">${ev[3]}</span><span class="vd"></span></div><div class="ar">${esc(ev[4])}</div>`, rows);
          row.style.opacity = 0;
          rows.scrollTop = rows.scrollHeight;
          const a = rel(src), b = rel(row);
          const fl = at(el('div', 'fly cfly', ev[3]), a.x + a.w / 2, a.y + a.h / 2 - 14);
          await A(fl, [{ transform: 'translate(0,0) scale(.85)', opacity: .3 }, { transform: `translate(${(b.x - a.x - a.w / 2) * .5}px, ${(b.y - a.y - a.h / 2) * .5 - 40}px)`, opacity: 1, offset: .55 }, { transform: `translate(${b.x - a.x - a.w / 2}px, ${b.y - a.y - a.h / 2 + 14}px)`, opacity: .8 }], 700, { ease: 'cubic-bezier(.45,.05,.3,1)' });
          fl.remove(); row.style.opacity = 1; await snap(row);
          const vd = $('.vd', row);
          vd.textContent = ev[5] ? 'allowed' : 'blocked'; vd.className = 'vd ' + (ev[5] ? 'ok2' : 'blk'); await snap(vd);
          if (!ev[5]) row.classList.add('blocked');
          now += 900;
        } else if (type === 'o') {
          const r = rows.lastElementChild; if (r) { const out = el('div', 'out', esc(ev[3]), r); if (ev[3].startsWith('Bylaw:')) out.classList.add('bmsg'); await fadeIn(out, 200); }
        } else if (type === 's') { if (await state.apply(ev[2])) hit = true; now += 300; }
        rows.scrollTop = rows.scrollHeight; msgs.scrollTop = msgs.scrollHeight;
      }
      return hit;
    },
  };
}

async function sExecCs() {
  const d = CS;
  title('Execute: one chain, against a fresh session', 'Offline: Bylaw calls the demo’s tool functions directly. No model, milliseconds per step.');
  const G = execGraph(d);
  const P = at(el('div', ''), 790, 96, 450);
  const call = el('div', 'card', '<div class="call"></div><div class="stamps"></div>', P);
  const state = stateCard(P); state.el.style.marginTop = '12px';
  const stamps = async ids => { const box = $('.stamps', call); box.innerHTML = ''; for (const [i, r] of ids.entries()) snap(el('span', 'ok', r, box), i * 140).catch(() => {}); await W(ids.length * 140 + 400); };
  await W(400);
  say('The search picked this chain. Bylaw runs it on a fresh session, checking every call against the rules first.', 'app');
  await heroRun(d, G, [
    async () => {
      $('.call', call).innerHTML = '<b>flight_status_tool</b>(flight_number="FLT-123")';
      await stamps(['hand rules allow']);
      say('Step 1, look up FLT-123. It is on time. The session now holds Taylor Lee, LL0EZ6, FLT-123.', 'app');
      await state.apply({ passenger_name: 'Taylor Lee', confirmation_number: 'LL0EZ6', flight_number: 'FLT-123', seat_number: '23A', scenario: 'on_time' });
      await W(700);
    },
    async () => {
      $('.call', call).innerHTML = '<b>get_trip_details</b>(message="…my Paris trip … missed a connection in New York…")';
      await stamps(['hand rules allow']);
      say('Step 2, the word Paris flips the scenario to disrupted. The booking stays LL0EZ6 on FLT-123, still on time.', 'app');
      await state.apply({ scenario: 'disrupted' });
      await W(900);
    },
    async () => {
      $('.call', call).innerHTML = '<b>issue_compensation</b>(reason="Delay causing missed connection")';
      await stamps(['R-comp-confirmation allows']);
      say('Step 3, compensation. Every rule allows it: the prompts never say to check the flight.', 'app');
      await state.apply({ compensation_case_id: 'opened', vouchers: 1 });
    },
    async () => {
      G.rings[0].classList.add('lit');
      say('$280 of disruption vouchers on an on-time booking. Forbidden goal D1 is true.', 'app');
      await W(1600);
    }]);
  await replay5(d, G, P, 12);
  await W(1200);
}

async function sLive() {
  title('Live: the agents walk the same hole', 'Recorded conversation, Muse Spark driving all six agents. Spike run2, guard off.');
  const lv = liveConv(40, 92, 1200, 540, {});
  lv.meter.innerHTML = `<div class="bm"><svg viewBox="0 0 120 120" width="104" height="104"><circle cx="60" cy="60" r="34" class="ring" id="bmr"/><path class="crack" id="bmc" style="opacity:0" d="${crackD(60, 60, .8)}"/></svg><div><b class="mono">D1</b><div class="small">Disruption vouchers on a booking whose flight is on time</div><div class="mono bmv" id="bmv">vouchers null</div></div></div>`;
  await W(400);
  await lv.play(T1, { 0: ['The customer asks about a flight. Each agent is the model deciding what to say, who to hand off to, which tool to call.', 'model'], 4: ['Every tool call passes through the Bylaw lane. The guard is off here, so checks are recorded, not enforced.', 'app'] });
  await W(800);
  const hit = await lv.play(T2.map(e => [e[0], e[1] + 11, ...e.slice(2)]), {
    0: ['Then the claim: a Paris trip and a missed connection. Nothing in the session says so.', 'model'],
    6: ['get_trip_details believes the word Paris. The state now says disrupted; the flight is still on time.', 'app'],
    12: ['The Refunds agent reads the policy, as told, and issues the vouchers.', 'model'],
  });
  if (hit) {
    $('#bmr').classList.add('lit'); const c = $('#bmc'); c.style.opacity = 1; await draw(c, 700);
    $('#bmv').textContent = '$280 issued, flight on time';
    say('$280 issued on an on-time booking. The model followed its instructions; nothing checked the state.', 'app');
  }
  await W(3600);
}

async function fReplayCs() {
  title('The same conversation, without and with Bylaw', 'Spike run2 (guard off) and run3 (guard on), the voucher turn. Same model, same words.');
  const L = liveConv(40, 122, 590, 510, { compact: true, init: AFTER_T1, start: 'FI' });
  const R = liveConv(650, 122, 590, 510, { compact: true, init: AFTER_T1, start: 'FI', guard: true });
  at(el('div', 'side-h', 'Without Bylaw'), 40, 92); at(el('div', 'side-h', 'With Bylaw'), 650, 92);
  await W(500);
  say('The same request on both sides. The model proposes the same calls.', 'model');
  await Promise.all([
    L.play(T2, {}),
    R.play(T2G, { 12: ['With the amendment ratified, the guard refuses issue_compensation before it runs. The state stays clean.', 'app'] }),
  ]);
  say('Same agents, same words. The model proposes every call; the application decides which touch the state.', 'app');
  await W(4000);
}

async function fReplayB5() {
  title('The same attack, without and with Bylaw', 'Chain B5 sent by the agent, call for call.');
  const sides = [['Without Bylaw', false, 40], ['With Bylaw', true, 660]].map(([h, guard, x]) => {
    const s = at(el('div', 'card side'), x, 96, 580, 500);
    s.innerHTML = `<h3>${h}</h3><div class="sub">${guard ? 'Every call passes the Bylaw MCP proxy first.' : 'The agent calls the tools directly.'}</div>`;
    const g = sv('g', { transform: `translate(${x} 0)` });
    sv('circle', { cx: 60, cy: 230, r: 22, fill: 'var(--violet-soft)', stroke: 'var(--violet)', 'stroke-width': 2 }, g);
    sv('text', { x: 38, y: 272, class: 'lane-lab' }, g).textContent = 'agent';
    sv('line', { x1: 84, y1: 230, x2: 500, y2: 230, stroke: 'var(--line-2)', 'stroke-width': 1.5 }, g);
    sv('rect', { x: 500, y: 206, width: 48, height: 48, rx: 6, fill: 'var(--step)', stroke: 'var(--line-2)' }, g);
    sv('text', { x: 494, y: 272, class: 'lane-lab' }, g).textContent = 'τ² airline';
    if (guard) { sv('rect', { x: 296, y: 194, width: 10, height: 72, rx: 2, fill: 'var(--ink)' }, g); sv('text', { x: 268, y: 186, class: 'lane-lab' }, g).textContent = 'proxy'; }
    const res = at(el('div', '', `<div class="obj-h"><b>1ERWZ8</b><span class="pill">basic economy</span></div><div class="frow"><span>HAT208</span><span class="d">2024-05-24</span></div><div class="frow" style="border:0"><span>HAT300</span><span class="d">2024-05-29</span></div><div class="cond" style="margin-top:12px"><i></i>G1, basic economy flights changed</div>`, s), 18, 300, 544);
    return { s, guard, x, res };
  });
  await W(500);
  say('The agent is a model too. It proposes the same two calls on both sides.', 'model');
  const send = async (side, n, label) => {
    const p = at(el('div', 'pkt', `step ${n}  ${label}`), side.x + 90, 196);
    await fadeIn(p, 200);
    if (side.guard && n === 1) {
      await A(p, [{ transform: 'none' }, { transform: 'translateX(70px)' }], 700, { ease: 'cubic-bezier(.4,0,.2,1)' });
      p.classList.add('stopped');
      const r = at(el('div', 'refuse', `refused: ${AB5.id}`), side.x + 160, 290); await snap(r);
      return false;
    }
    await A(p, [{ transform: 'none' }, { transform: 'translateX(330px)' }], 1100, { ease: 'cubic-bezier(.4,0,.2,1)' });
    await A(p, [{ opacity: 1 }, { opacity: 0 }], 200);
    return true;
  };
  const L = sides[0], R = sides[1];
  const [okL] = await Promise.all([send(L, 1, 'cabin → economy'), send(R, 1, 'cabin → economy')]);
  if (okL) { const p = $('.pill', L.res); p.textContent = 'economy'; await snap(p); }
  say('Without Bylaw the upgrade lands. With Bylaw the proxy refuses it at step 1, with the rule that refused it.', 'app');
  await W(1200);
  await send(L, 2, 'new dates');
  const ds = L.res.querySelectorAll('.d'); ds[0].textContent = '2024-05-23'; ds[1].textContent = '2024-05-28'; ds.forEach(d => d.classList.add('chg'));
  $('.cond', L.res).classList.add('on'); $('.pill', L.res).classList.add('bad');
  const nr = at(el('p', 'small'), 18, 432, 544); nr.innerHTML = 'Step 2 never leaves the agent: the chain has nothing to build on. The booking is untouched.'; R.s.appendChild(nr);
  await fadeIn(nr, 400);
  const mon = at(el('p', 'small'), 18, 450, 544); mon.innerHTML = 'Even with nothing ratified, the goal monitor stops this chain at step 2 (G1), measured at bada101.'; L.s.appendChild(mon);
  say('Same agent, same calls. The model still proposes every one; the application decides which reach the database.', 'app');
  await fadeIn(mon, 400);
  await W(3600);
}

/* ───────────── scene list, chrome, controls ───────────── */
const scenes = () => st.view === 'scan'
  ? (st.run === 'cs'
    ? [['Compile', sCompile], ['Search', sSearch], ['Execute', sExecCs], ['Live', sLive], ['Sort', sSort]]
    : [['Compile', sCompile], ['Search', sSearch], ['Execute', st.run === 'retail' ? sExecRetail : sExecAirline], ['Classify', sVerdict], ['Sort', sSort]])
  : [['Draft', fDraft], ['Gate', fGate], ['Backtest', fBacktest], ['Ratify', fRatify], ['Replay', st.run === 'cs' ? fReplayCs : fReplayB5]];
function title(t, s) { $('#title').innerHTML = `${esc(t)}<small>${esc(s)}</small>`; }

function chrome() {
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === st.view));
  document.querySelectorAll('[data-run]').forEach(b => b.setAttribute('aria-pressed', b.dataset.run === st.run));
  $('[data-run="retail"]').style.display = st.view === 'scan' ? '' : 'none';
  $('#play').innerHTML = st.playing ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
  $('#play').setAttribute('aria-label', st.playing ? 'Pause' : 'Play');
  $('#chapters').innerHTML = scenes().map(([n], i) => `<button class="chap" data-i="${i}" ${i === st.i ? 'aria-current="step"' : ''}><b>${i + 1}</b>${n}</button>`).join('');
  const muse = st.run !== 'retail';
  $('#a-model').classList.toggle('off', !muse);
  $('#a-model').lastChild.textContent = muse ? 'Muse Spark proposes' : 'Muse Spark, off in this run';
  $('#a-human').style.display = st.view === 'fix' ? '' : 'none';
  location.hash = `${st.view}/${st.run}/${st.i + 1}`;
}

async function go(i, end = false) {
  st.token++; const tok = st.token;
  live.forEach(a => a.cancel()); live.clear();
  st.i = Math.max(0, Math.min(i, scenes().length - 1)); st.done = false;
  gfx.innerHTML = ''; layer.innerHTML = ''; clock.innerHTML = '';
  say('', null); chrome();
  instant = end;
  try {
    await scenes()[st.i][1]();
    if (tok !== st.token) return;
    instant = false; st.done = true;
    if (st.playing && st.i < scenes().length - 1) { await W(900); go(st.i + 1); }
    else if (st.playing) { st.playing = false; chrome(); }
  } catch (e) { if (e !== ABORT && e.name !== 'AbortError') console.error(e); }
  finally { if (tok === st.token) instant = false; }
}
function setPlaying(p) {
  st.playing = p; live.forEach(a => (p ? a.play() : a.pause())); chrome();
  if (p && st.done) st.i < scenes().length - 1 ? go(st.i + 1) : go(0);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.view && b.dataset.view !== st.view) { st.view = b.dataset.view; if (st.view === 'fix' && st.run === 'retail') st.run = 'airline'; go(0); }
  else if (b.dataset.run && b.dataset.run !== st.run) { st.run = b.dataset.run; go(st.i); }
  else if (b.dataset.i) go(+b.dataset.i);
  else if (b.id === 'play') setPlaying(!st.playing);
  else if (b.id === 'prev') go(st.i - 1);
  else if (b.id === 'next') go(st.i + 1);
  else if (b.id === 'restart') go(st.i);
  else if (b.id === 'speed') { st.rate = st.rate === 1 ? 2 : st.rate === 2 ? .5 : 1; b.textContent = st.rate + '×'; b.setAttribute('aria-label', `Playback speed, ${st.rate}×`); live.forEach(a => (a.playbackRate = st.rate)); }
  else if (b.id === 'theme') { const l = document.documentElement.dataset.theme !== 'light'; document.documentElement.dataset.theme = l ? 'light' : 'dark'; b.setAttribute('aria-label', l ? 'Switch to dark theme' : 'Switch to light theme'); try { localStorage.setItem('vz1-theme', l ? 'light' : 'dark'); } catch {} }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); setPlaying(!st.playing); }
  else if (e.key === 'ArrowRight') go(st.i + 1);
  else if (e.key === 'ArrowLeft') go(st.i - 1);
});
function fit() { const f = $('#frame'), k = f.clientWidth / 1280; stage.style.transform = `scale(${k})`; f.style.height = 720 * k + 'px'; }
addEventListener('resize', fit);
try { const t = localStorage.getItem('vz1-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
// #view/run/scene[/end]: end jumps to the scene's last frame (used for stills).
const [hv, hr, hi, he] = location.hash.slice(1).split('/');
if (hv === 'fix' || hv === 'scan') st.view = hv;
if (['cs', 'airline', 'retail'].includes(hr)) st.run = hr;
fit();
document.fonts.ready.then(() => go((+hi || 1) - 1, he === 'end'));
</script>
