[project]
name = "bylaw"
version = "0.1.0"
description = "Audits the policy AI agents run on: finds chains of allowed actions that reach forbidden outcomes, proves them, patches them."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "openai>=1.50",
    "openai-agents==0.24.0",
    "openai-chatkit==1.6.5",
    "pydantic-ai-slim[mcp,openai]==2.63.0",
    "python-dotenv>=1.0",
    "tau2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Meta Model API (needs MODEL_API_KEY)"]
addopts = "-m 'not live'"

[tool.uv.sources]
tau2 = { path = ".context/tau2-bench", editable = true }
