services:
  bylaw:
    build: .
    image: bylaw:local
    # No published port: the API has no auth of its own, so only caddy reaches it, on the compose network.
    env_file:
      - path: .env  # MODEL_API_KEY for Muse audits; optional, offline audits run without it
        required: false
    environment:
      BYLAW_REPORTS_DIR: /app/reports
      BYLAW_RATIFIED_DIR: /app/ratified
      BYLAW_CACHE_DIR: /app/.cache/reports
      TAU2_DATA_DIR: /app/.context/tau2-bench/data
    volumes:
      - ./reports:/app/reports      # committed demo reports and bench (DM1)
      - ./ratified:/app/ratified    # ratified amendments (C10)
      - ./.cache:/app/.cache        # API-run audit reports and the Muse response cache (.cache/llm)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/domains', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    depends_on: [bylaw]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Read from .env by compose interpolation; compose refuses to start without the auth pair.
    environment:
      BYLAW_DOMAIN: ${BYLAW_DOMAIN:-:80}  # Caddy keeps an empty value instead of its own default
      BYLAW_BASIC_AUTH_USER: ${BYLAW_BASIC_AUTH_USER:?set BYLAW_BASIC_AUTH_USER in .env}
      BYLAW_BASIC_AUTH_HASH: ${BYLAW_BASIC_AUTH_HASH:?set BYLAW_BASIC_AUTH_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # TLS certificates and ACME account
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
