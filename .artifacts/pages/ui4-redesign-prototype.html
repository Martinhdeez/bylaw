<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050508" />
<title>Bylaw UI4 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
/* UI4 prototype. Tokens: Bylaw's semantic colours (red = hole, amber = class B, green = allowed/ratified)
   stay. New: violet accent for chrome, Muse and CTAs; black ground with stars; glow beams; pills. */
:root {
  --ground: #050508;
  --sunk: #0a0a10;
  --panel: #0e0e15;
  --raise: #15151e;
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.14);
  --ink: #f5f4fa;
  --muted: #9a98ab;
  --faint: #6b6980;
  --violet: #9152ff;
  --violet-hi: #b48cff;
  --violet-soft: rgba(145, 82, 255, 0.14);
  --violet-glow: rgba(145, 82, 255, 0.5);
  --red: #ff4d2e;
  --red-soft: rgba(255, 77, 46, 0.12);
  --green: #2be3a0;
  --green-soft: rgba(43, 227, 160, 0.1);
  --amber: #ffb02e;
  --amber-soft: rgba(255, 176, 46, 0.12);
  --paper: #efeef4;
  --paper-ink: #0b0b12;
  --paper-muted: #5d5b6e;
  --display: "Archivo", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
* { font-feature-settings: "calt" 0, "liga" 0 !important; }
html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--ground); color: var(--ink); font: 400 15px/1.5 var(--display); -webkit-font-smoothing: antialiased; }
body {
  /* starfield: a few sparse dot layers, fixed */
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1px 1px at 67% 9%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1px 1px at 88% 34%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 41% 72%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1px 1px at 79% 81%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 23% 91%, rgba(255,255,255,.25), transparent 60%);
  background-size: 420px 420px, 560px 560px, 380px 380px, 640px 640px, 500px 500px, 700px 700px;
  background-attachment: fixed;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--violet-hi); outline-offset: 2px; border-radius: 10px; }
code, pre, .mono { font-family: var(--mono); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 30; background: var(--ink); color: var(--paper-ink); padding: 8px 14px; border-radius: 999px; font-weight: 700; }
.skip:focus { top: 12px; }
.main:focus { outline: none; }

/* ── shell ─────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100dvh; transition: grid-template-columns 260ms var(--ease); }
.rail {
  position: sticky; top: 0; height: 100dvh; padding: 22px 14px; display: flex; flex-direction: column; gap: 28px;
  background: linear-gradient(180deg, rgba(145,82,255,.07), transparent 28%), rgba(5,5,8,.82);
  border-right: 1px solid var(--line); backdrop-filter: blur(12px); z-index: 5;
}
.rail-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lockup { display: flex; align-items: center; gap: 10px; padding: 0 8px; white-space: nowrap; }
.lockup svg { width: 32px; height: 32px; color: var(--ink); filter: drop-shadow(0 0 12px rgba(145,82,255,.35)); }
.lockup b { font: 800 25px/1 var(--display); letter-spacing: -0.035em; }
.rail-toggle { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 999px; color: var(--muted); transition: color .2s, background .2s; }
.rail-toggle:hover { color: var(--ink); background: var(--raise); }

.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 11px; height: 42px; padding: 0 14px; border-radius: 999px;
  color: var(--muted); font-weight: 600; white-space: nowrap; isolation: isolate;
  transition: color .2s var(--ease), transform .2s var(--ease);
}
/* Hover: a soft violet glow pill that fades in (not a flat grey block). */
.nav a::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; opacity: 0;
  background:
    radial-gradient(120% 140% at 0% 50%, rgba(145,82,255,.30), transparent 62%),
    linear-gradient(90deg, rgba(145,82,255,.12), rgba(145,82,255,.03));
  box-shadow: inset 0 0 0 1px rgba(180,140,255,.18), 0 0 22px -6px var(--violet-glow);
  transition: opacity .22s var(--ease);
}
.nav a svg { transition: color .2s, filter .2s; }
.nav a:hover { color: var(--ink); }
.nav a:hover::before { opacity: 1; }
.nav a:hover svg { color: var(--violet-hi); }
.nav a:active { transform: scale(.98); }
/* Active: a filled glass pill with a top highlight and a lit dot. */
.nav a[aria-current="page"] { color: var(--ink); }
.nav a[aria-current="page"]::before {
  opacity: 1;
  background:
    radial-gradient(120% 160% at 0% 50%, rgba(145,82,255,.42), transparent 65%),
    linear-gradient(90deg, rgba(145,82,255,.22), rgba(255,255,255,.04));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(180,140,255,.30), 0 0 28px -4px var(--violet-glow);
}
.nav a[aria-current="page"] svg { color: var(--violet-hi); filter: drop-shadow(0 0 6px var(--violet)); }
.nav a:focus-visible { outline: 2px solid var(--violet-hi); outline-offset: 2px; border-radius: 999px; }
.nav .count { margin-left: auto; min-width: 24px; height: 22px; padding: 0 7px; display: grid; place-items: center; border-radius: 999px; font: 700 11.5px var(--mono); color: var(--amber); background: var(--amber-soft); }
.nav .count.r { color: var(--red); background: var(--red-soft); }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
.meter { position: relative; border-radius: 16px; padding: 14px; background: linear-gradient(180deg, rgba(145,82,255,.10), rgba(255,255,255,.02)); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.meter::before { content: ""; position: absolute; left: 12%; right: 12%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--violet), #fff, var(--violet), transparent); }
.meter .k { font: 700 11px var(--mono); color: var(--violet-hi); letter-spacing: .06em; display: flex; align-items: center; gap: 6px; }
.meter .v { font: 600 26px/1 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.meter .s { font: 500 11.5px var(--mono); color: var(--muted); }
.proto { font: 500 11px var(--mono); color: var(--faint); padding: 0 6px; display: flex; gap: 6px; align-items: baseline; }

@media (min-width: 761px) {
  .collapsed { grid-template-columns: 76px 1fr; }
  .collapsed .rail { padding-inline: 14px; overflow: hidden; }
  .collapsed .rail-head { justify-content: center; }
  .collapsed .lockup { padding: 0; }
  .collapsed .lockup b, .collapsed .nav .count, .collapsed .rail-foot { display: none; }
  .collapsed .nav { align-items: center; }
  .collapsed .nav a { width: 46px; height: 46px; padding: 0; justify-content: center; }
  .collapsed .nav .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .collapsed .nav a::before { background: radial-gradient(circle at 50% 50%, rgba(145,82,255,.34), rgba(145,82,255,.06) 70%); }
  /* The toggle covers the logo: invisible at rest, the panel icon on hover or keyboard focus (UI3). */
  .collapsed .rail-toggle { position: absolute; inset: 0; margin: auto; width: 40px; height: 40px; opacity: 0; color: var(--ink); background: var(--raise); box-shadow: inset 0 0 0 1px rgba(180,140,255,.3), 0 0 18px -4px var(--violet-glow); transition: opacity .14s; }
  .collapsed .rail-toggle:hover, .collapsed .rail-toggle:focus-visible { opacity: 1; }
}

/* ── main + halo ───────────────────────────────────── */
.main { position: relative; min-width: 0; padding: 64px 44px 72px; overflow-x: clip; }
.halo { position: absolute; inset: 0 0 auto; height: 420px; pointer-events: none; overflow: hidden; z-index: 0; }
.halo::before { /* the planet-arc horizon of the reference, toned down for a tool */
  content: ""; position: absolute; left: 50%; top: -1240px; width: 1700px; height: 1300px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, #050508 93%, rgba(145,82,255,.25) 97%, transparent 100%);
  box-shadow: 0 1px 0 0 rgba(205,175,255,.55), 0 18px 70px 6px rgba(145,82,255,.38), 0 40px 160px 40px rgba(145,82,255,.12);
  animation: breathe 7s ease-in-out infinite;
}
.halo::after { content: ""; position: absolute; left: 50%; top: 18px; width: 560px; height: 120px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(180,140,255,.22), transparent); filter: blur(10px); }
@keyframes breathe { 50% { box-shadow: 0 1px 0 0 rgba(205,175,255,.7), 0 22px 90px 10px rgba(145,82,255,.46), 0 40px 180px 50px rgba(145,82,255,.14); } }
.page { position: relative; z-index: 1; max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
/* Entrance: blur → sharp, staggered, like the reference's dashboard reveal. */
.page > * { animation: enter .7s var(--ease) both; }
.page > *:nth-child(2) { animation-delay: .06s; } .page > *:nth-child(3) { animation-delay: .12s; }
.page > *:nth-child(4) { animation-delay: .18s; } .page > *:nth-child(5) { animation-delay: .24s; }
.page > *:nth-child(n+6) { animation-delay: .3s; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); filter: blur(8px); } }

/* ── header ───────────────────────────────────────── */
.crumbs { display: flex; align-items: center; gap: 6px; font: 500 12.5px var(--mono); color: var(--muted); flex-wrap: wrap; }
.crumbs a { border-radius: 6px; } .crumbs a:hover { color: var(--ink); }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.title { font: 800 52px/1.02 var(--display); letter-spacing: -0.035em; text-wrap: balance; }
.title .v { background: linear-gradient(180deg, #c9a8ff, var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.title .r { color: var(--red); } .title .b { color: var(--amber); } .title .g { color: var(--green); }
.title.sm { font-size: 34px; }
.lede { color: var(--muted); font-size: 16px; max-width: 70ch; margin-top: 12px; text-wrap: pretty; }
.mono-t { font: 700 .4em var(--mono); color: var(--muted); letter-spacing: 0; vertical-align: middle; white-space: nowrap; }

/* ── parts ────────────────────────────────────────── */
.tag { display: inline-flex; align-items: center; gap: 6px; font: 700 11.5px var(--mono); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.tag.muse { color: var(--violet-hi); border-color: rgba(180,140,255,.35); background: var(--violet-soft); box-shadow: 0 0 16px -6px var(--violet-glow); }
.tag.red { color: var(--red); border-color: rgba(255,77,46,.45); background: var(--red-soft); }
.tag.green { color: var(--green); border-color: rgba(43,227,160,.4); background: var(--green-soft); }
.tag.amber { color: var(--amber); border-color: rgba(255,176,46,.45); background: var(--amber-soft); }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 22px; border-radius: 999px; font-weight: 700; white-space: nowrap; border: 1px solid var(--line-2); background: #14141c; transition: background .2s, box-shadow .2s, transform .12s, border-color .2s; }
.btn:hover { background: #1c1c26; border-color: rgba(255,255,255,.22); }
.btn:active { transform: scale(.98); }
.btn.primary { color: #fff; border-color: transparent; background: linear-gradient(180deg, #a06bff, #8240ff); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 0 0 1px rgba(160,107,255,.5), 0 8px 28px -6px var(--violet-glow); }
.btn.primary:hover { background: linear-gradient(180deg, #ad80ff, #8c4dff); box-shadow: inset 0 1px 0 rgba(255,255,255,.32), 0 0 0 1px rgba(180,140,255,.7), 0 10px 36px -4px rgba(145,82,255,.7); }
.btn.ratify { color: #04130d; border-color: transparent; background: linear-gradient(180deg, #5af0b9, #22cf90); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 28px -8px rgba(43,227,160,.6); height: 50px; font-size: 16px; }
.btn.sm { height: 34px; padding: 0 14px; font-size: 13px; }
.btn.icon { width: 34px; padding: 0; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.link { color: var(--violet-hi); text-decoration: underline; text-underline-offset: 3px; }

/* panel: dark glass with a hairline and an optional lit top edge ("beam") */
.panel { position: relative; background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012)); border: 1px solid var(--line); border-radius: 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
.panel.beam { overflow: hidden; }
.panel.beam::before { content: ""; position: absolute; left: 8%; right: 8%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--violet) 25%, #f2e9ff 50%, var(--violet) 75%, transparent); }
.panel.beam::after { content: ""; position: absolute; left: 20%; right: 20%; top: -60px; height: 120px; background: radial-gradient(closest-side, rgba(145,82,255,.28), transparent); pointer-events: none; }
.panel-h { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.panel-h h2, .h2 { font: 700 15px var(--display); letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel-b { position: relative; z-index: 1; padding: 20px; }
.label { font: 600 11.5px var(--mono); color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.paper { background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 16px 18px; }
.paper .src { font: 700 12px var(--mono); color: var(--paper-muted); margin-bottom: 8px; }
.quote { font: 600 15.5px/1.45 var(--display); border-left: 3px solid #c8c4d6; padding-left: 12px; white-space: pre-line; }

.notice { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 16px; border: 1px solid rgba(255,77,46,.45); background: var(--red-soft); }
.notice svg { color: var(--red); flex: none; margin-top: 2px; }
.notice b { display: block; } .notice p { color: var(--muted); font-size: 14px; }
.empty-state { padding: 56px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.empty-state .shield { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--violet-soft); color: var(--violet-hi); box-shadow: 0 0 30px -6px var(--violet-glow), inset 0 0 0 1px rgba(180,140,255,.25); }
.empty-state p { color: var(--muted); max-width: 54ch; }
.skel { border-radius: 14px; background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(145,82,255,.08), rgba(255,255,255,.03)); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }

/* ── audit ───────────────────────────────────────── */
.domains { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.domain { position: relative; text-align: left; padding: 20px 22px; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)); display: flex; flex-direction: column; gap: 12px; overflow: hidden; transition: border-color .2s, box-shadow .25s, transform .2s var(--ease); }
.domain:hover { border-color: rgba(180,140,255,.3); transform: translateY(-2px); }
.domain[aria-checked="true"] { border-color: rgba(180,140,255,.55); box-shadow: 0 0 0 1px rgba(180,140,255,.35), 0 18px 50px -20px var(--violet-glow); background: radial-gradient(80% 120% at 50% -20%, rgba(145,82,255,.22), transparent 60%), linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01)); }
.domain[aria-checked="true"]::before { content: ""; position: absolute; left: 10%; right: 10%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--violet), #fff, var(--violet), transparent); }
.domain .n { display: flex; align-items: center; justify-content: space-between; font: 800 26px/1 var(--display); letter-spacing: -0.03em; }
.domain .n .ck { width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; background: var(--violet); color: #fff; box-shadow: 0 0 16px var(--violet-glow); }
.domain .d { color: var(--muted); font-size: 14px; }
.domain .tools { display: flex; flex-wrap: wrap; gap: 6px; }
.domain .tools code { font-size: 11px; color: var(--muted); background: rgba(255,255,255,.04); border: 1px solid var(--line); padding: 3px 8px; border-radius: 999px; }
.runbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 14px 14px 22px; border-radius: 999px; }
.runbar .opts { display: flex; gap: 22px; color: var(--muted); font: 500 13px var(--mono); flex-wrap: wrap; align-items: center; }
.runbar .opts b { color: var(--ink); }
.opt { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.opt input[type=checkbox] { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: #22222c; border: 1px solid var(--line-2); position: relative; cursor: pointer; transition: background .2s; flex: none; }
.opt input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #8c8a9c; transition: transform .2s var(--ease), background .2s; }
.opt input[type=checkbox]:checked { background: var(--violet); border-color: transparent; box-shadow: 0 0 12px -2px var(--violet-glow); }
.opt input[type=checkbox]:checked::after { transform: translateX(14px); background: #fff; }
.opt input:focus-visible { outline: 2px solid var(--violet-hi); outline-offset: 2px; }
.num-in { width: 80px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); background: #101017; color: var(--ink); font: 700 13px var(--mono); }

.phases { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.phase .tag { white-space: normal; }
.phase { position: relative; z-index: 1; padding: 20px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; min-height: 148px; transition: background .4s; }
.phase:last-child { border-right: 0; }
.phase .st { display: flex; align-items: center; gap: 8px; font: 700 11.5px var(--mono); color: var(--faint); }
.phase .st .n { width: 20px; height: 20px; border-radius: 999px; display: grid; place-items: center; border: 1px solid var(--line-2); }
.phase .nm { font: 700 19px/1.1 var(--display); letter-spacing: -0.02em; color: var(--faint); }
.phase .dt { font-size: 13px; color: var(--faint); }
.phase .bar { margin-top: auto; height: 3px; border-radius: 2px; background: rgba(255,255,255,.06); overflow: hidden; }
.phase .bar i { display: block; height: 100%; width: 100%; background: var(--violet); transform-origin: left; transform: scaleX(0); transition: transform .5s var(--ease); }
.phase.done .nm, .phase.active .nm { color: var(--ink); }
.phase.done .dt, .phase.active .dt { color: var(--muted); }
.phase.done .st { color: var(--green); } .phase.done .bar i { background: var(--green); transform: scaleX(1); }
.phase.active .st { color: var(--violet-hi); }
.phase.active { background: radial-gradient(100% 80% at 50% 0%, rgba(145,82,255,.2), transparent 70%); }
.phase.active .bar i { transform: scaleX(.35); animation: indet 1.4s ease-in-out infinite; box-shadow: 0 0 10px var(--violet); }
.phase.stopped .st { color: var(--red); }
@keyframes indet { from { transform: translateX(-100%) scaleX(.35); } to { transform: translateX(300%) scaleX(.35); } }

.live { display: grid; grid-template-columns: 1fr 320px; gap: 14px; }
.log { font: 500 12.5px/1.8 var(--mono); color: var(--muted); padding: 16px 20px; height: 210px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.log span { white-space: pre-wrap; animation: logline .35s var(--ease) both; }
@keyframes logline { from { opacity: 0; transform: translateY(4px); } }
.log .ok { color: var(--green); } .log .bad { color: var(--red); } .log .mu { color: var(--violet-hi); }
.tokens { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.tokens .big { position: relative; z-index: 1; font: 600 54px/1 var(--display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.tokens .row { position: relative; z-index: 1; display: flex; justify-content: space-between; font: 500 13px var(--mono); color: var(--muted); padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.03); }
.tokens .row b { color: var(--ink); }
.tokens > .tag { position: relative; z-index: 1; align-self: flex-start; }

/* ── report ──────────────────────────────────────── */
.summary { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 12px; }
.stat { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; border-radius: 18px; }
.stat .v { font: 600 40px/1 var(--display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.stat .v.r { color: var(--red); } .stat .v.b { color: var(--amber); }

not be modified.","description":"Pre-registered predicate in bylaw/goals.py (frozen)."},{"id":"G2","name":"nonrefundable_refunded","policy_ref":"Otherwise, flight can be cancelled if any of the following is true: - The booking was made within the last 24 hrs - The flight is cancelled by airline - It is a business flight - The user has travel insurance and the reason for cancellation is covered by insurance.","description":"Pre-registered predicate in bylaw/goals.py (frozen)."},{"id":"G3","name":"insurance_added_after_booking","policy_ref":"The user cannot add insurance after initial booking.","description":"Pre-registered predicate in bylaw/goals.py (frozen)."},{"id":"G4","name":"passenger_count_changed","policy_ref":"The user can modify passengers but cannot modify the number of passengers.","description":"Pre-registered predicate in bylaw/goals.py (frozen)."},{"id":"G5","name":"free_bags_over_allowance","policy_ref":"If the booking user is a regular member: - 0 free checked bag for each basic economy passenger - 1 free checked bag for each economy passenger - 2 free checked bags for each business passenger (silver 1/2/3, gold 2/3/4)","description":"Pre-registered predicate in bylaw/goals.py (frozen)."},{"id":"G6","name":"compensation_ineligible","policy_ref":"Do not compensate if the user is regular member and has no travel insurance and flies (basic) economy.","description":"Pre-registered predicate in bylaw/goals.py (frozen)."},{"id":"G7","name":"compensation_duplicated","policy_ref":"Do not offer compensation for any other reason than the ones listed above.","description":"Pre-registered predicate in bylaw/goals.py (frozen)."}],"policy":["# Airline Agent Policy","","The current time is 2024-05-15 15:00:00 EST.","","As an airline agent, you can help users **book**, **modify**, or **cancel** flight reservations. You also handle **refunds and compensation**.","","Before taking any actions that update the booking database (booking, modifying flights, editing baggage, changing cabin class, or updating passenger information), you must list the action details and obtain explicit user confirmation (yes) to proceed.","","You should not provide any information, knowledge, or procedures not provided by the user or available tools, or give subjective recommendations or comments.","","You should only make one tool call at a time, and if you make a tool call, you should not respond to the user simultaneously. If you respond to the user, you should not make a tool call at the same time.","","You should deny user requests that are against this policy.","","You should transfer the user to a human agent if and only if the request cannot be handled within the scope of your actions. To transfer, first make a tool call to transfer_to_human_agents, and then send the message 'YOU ARE BEING TRANSFERRED TO A HUMAN AGENT. PLEASE HOLD ON.' to the user.","","## Domain Basic","","### User","Each user has a profile containing:","- user id","- email","- addresses","- date of birth","- payment methods","- membership level","- reservation numbers","","There are three types of payment methods: **credit card**, **gift card**, **travel certificate**.","","There are three membership levels: **regular**, **silver**, **gold**.","","### Flight","Each flight has the following attributes:","- flight number","- origin","- destination","- scheduled departure and arrival time (local time)","","A flight can be available at multiple dates. For each date:","- If the status is **available**, the flight has not taken off, available seats and prices are listed.","- If the status is **delayed** or **on time**, the flight has not taken off, cannot be booked.","- If the status is **flying**, the flight has taken off but not landed, cannot be booked.","","There are three cabin classes: **basic economy**, **economy**, **business**. **basic economy** is its own class, completely distinct from **economy**.","","Seat availability and prices are listed for each cabin class.","","### Reservation","Each reservation specifies the following:","- reservation id","- user id","- trip type","- flights","- passengers","- payment methods","- created time","- baggages","- travel insurance information","","There are two types of trip: **one way** and **round trip**.","","## Book flight","","The agent must first obtain the user id from the user. ","","The agent should then ask for the trip type, origin, destination.","","Cabin:","- Cabin class must be the same across all the flights in a reservation. ","","Passengers: ","- Each reservation can have at most five passengers. ","- The agent needs to collect the first name, last name, and date of birth for each passenger. ","- All passengers must fly the same flights in the same cabin.","","Payment: ","- Each reservation can use at most one travel certificate, at most one credit card, and at most three gift cards. ","- The remaining amount of a travel certificate is not refundable. ","- All payment methods must already be in user profile for safety reasons.","","Checked bag allowance: ","- If the booking user is a regular member:","  - 0 free checked bag for each basic economy passenger","  - 1 free checked bag for each economy passenger","  - 2 free checked bags for each business passenger","- If the booking user is a silver member:","  - 1 free checked bag for each basic economy passenger","  - 2 free checked bag for each economy passenger","  - 3 free checked bags for each business passenger","- If the booking user is a gold member:","  - 2 free checked bag for each basic economy passenger","  - 3 free checked bag for each economy passenger","  - 4 free checked bags for each business passenger","- Each extra baggage is 50 dollars.","","Do not add checked bags that the user does not need.","","Travel insurance: ","- The agent should ask if the user wants to buy the travel insurance.","- The travel insurance is 30 dollars per passenger and enables full refund if the user needs to cancel the flight given health or weather reasons.","","## Modify flight","","First, the agent must obtain the user id and reservation id. ","- The user must provide their user id. ","- If the user doesn't know their reservation id, the agent should help locate it using available tools.","","Change flights: ","- Basic economy flights cannot be modified.","- Other reservations can be modified without changing the origin, destination, and trip type.","- Some flight segments can be kept, but their prices will not be updated based on the current price.","- The API does not check these for the agent, so the agent must make sure the rules apply before calling the API!","","Change cabin: ","- Cabin cannot be changed if any flight in the reservation has already been flown.","- In other cases, all reservations, including basic economy, can change cabin without changing the flights.","- Cabin class must remain the same across all the flights in the same reservation; changing cabin for just one flight segment is not possible.","- If the price after cabin change is higher than the original price, the user is required to pay for the difference.","- If the price after cabin change is lower than the original price, the user is should be refunded the difference.","","Change baggage and insurance: ","- The user can add but not remove checked bags.","- The user cannot add insurance after initial booking.","","Change passengers:","- The user can modify passengers but cannot modify the number of passengers.","- Even a human agent cannot modify the number of passengers.","","Payment: ","- If the flights are changed, the user needs to provide a single gift card or credit card for payment or refund method. The payment method must already be in user profile for safety reasons.","","## Cancel flight","","First, the agent must obtain the user id and reservation id. ","- The user must provide their user id. ","- If the user doesn't know their reservation id, the agent should help locate it using available tools.","","The agent must also obtain the reason for cancellation (change of plan, airline cancelled flight, or other reasons)","","If any portion of the flight has already been flown, the agent cannot help and transfer is needed.","","Otherwise, flight can be cancelled if any of the following is true:","- The booking was made within the last 24 hrs","- The flight is cancelled by airline","- It is a business flight","- The user has travel insurance and the reason for cancellation is covered by insurance.","","The API does not check that cancellation rules are met, so the agent must make sure the rules apply before calling the API!","","Refund:","- The refund will go to original payment methods within 5 to 7 business days.","","## Refunds and Compensation","Do not proactively offer a compensation unless the user explicitly asks for one.","","Do not compensate if the user is regular member and has no travel insurance and flies (basic) economy.","","Always confirms the facts before offering compensation.","","Only compensate if the user is a silver/gold member or has travel insurance or flies business.","","- If the user complains about cancelled flights in a reservation, the agent can offer a certificate as a gesture after confirming the facts, with the amount being $100 times the number of passengers.","","- If the user complains about delayed flights in a reservation and wants to change or cancel the reservation, the agent can offer a certificate as a gesture after confirming the facts and changing or cancelling the reservation, with the amount being $50 times the number of passengers.","","Do not offer compensation for any other reason than the ones listed above."]}</script>

const COLLAPSED = "bylaw.sidebar.collapsed";
const useCollapsed = () => {
  const [c, set] = useState(() => { try { return localStorage.getItem(COLLAPSED) === "1"; } catch { return false; } });
  const toggle = () => set((v) => { try { localStorage.setItem(COLLAPSED, v ? "0" : "1"); } catch {} return !v; });
  return [c, toggle];
};

function App() {
  const path = useHash();
  const [, seg, section, rawKey, sub] = path.split("/");
  const inUrl = seg === "airline" || seg === "retail" ? seg : undefined;
  const [last, setLast] = useState("airline");
  useEffect(() => void (inUrl && setLast(inUrl)), [inUrl]);
  const domain = inUrl ?? last;
  const key = rawKey ? decodeURIComponent(rawKey) : "";
  const [state, setState] = useState("adjudicated"); // adjudicated | raw | empty | loading | error
  const [ratified, setRatified] = useState({}); // hole_key -> ratified_at
  const [collapsed, toggle] = useCollapsed();

  // Retail has no report in the fixture: it shows the 404 empty state, as the mock does.
  const load = useMemo(() => {
    if (state === "loading") return { loading: true };
    if (state === "error") return { error: { status: 0 } };
    if (domain === "retail") return { error: { status: 404 } };
    if (state === "empty") return { data: { ...REPORTS.raw, holes: [], contradictions: [], ambiguities: [] } };
    return { data: REPORTS[state] };
  }, [state, domain]);
  const r = load.data;
  const all = r ? [...r.holes, ...(r.contradictions ?? []), ...r.ambiguities] : [];
  const hole = all.find((h) => h.key === key);

  let page;
  if (inUrl && section === "report") page = <ReportView domain={domain} load={load} ratified={ratified} onRetry={() => setState("adjudicated")} />;
  else if (inUrl && section === "holes" && key && sub === "amendment") page = <AmendmentView domain={domain} h={hole} hkey={key} ratified={ratified} onRatify={(k) => setRatified((x) => ({ ...x, [k]: new Date().toISOString() }))} />;
  else if (inUrl && section === "holes" && key) page = <HoleView domain={domain} h={hole} hkey={key} isFixed={!!ratified[key]} />;
  else if (inUrl && section === "bench") page = <Bench domain={domain} broken={state === "error"} loading={state === "loading"} />;
  else page = <Audit domain={domain} onDomain={setLast} failRun={state === "error"} />;

  const nB = r?.contradictions?.length ?? 0, nA = r?.holes.length ?? 0;
  const nav = [
    { href: "#/", icon: PlayCircle, label: "Audit", on: !inUrl },
    { href: `#/${domain}/report`, icon: FileWarning, label: "Report", on: section === "report" || section === "holes", count: nA || nB, red: nA > 0 },
    { href: `#/${domain}/bench`, icon: Gauge, label: "Bench", on: section === "bench" },
  ];

  return (
    <div className={collapsed ? "shell collapsed" : "shell"}>
      <a className="skip" href="#/" onClick={(e) => { e.preventDefault(); document.getElementById("main")?.focus(); }}>Skip to content</a>
      <aside className="rail">
        <div className="rail-head">
          <a className="lockup" href="#/" aria-label="Bylaw home"><Logo /><b>bylaw</b></a>
          <button className="rail-toggle" aria-label={collapsed ? "Expand sidebar" : "Collapse sidebar"} onClick={toggle}>
            {collapsed ? <PanelLeftOpen size={18} aria-hidden="true" /> : <PanelLeftClose size={18} aria-hidden="true" />}
          </button>
        </div>
        <nav className="nav" aria-label="Main">
          {nav.map((n) => (
            <a key={n.label} href={n.href} aria-current={n.on ? "page" : undefined} title={collapsed ? n.label : undefined}>
              <n.icon size={17} aria-hidden="true" />
              <span className="lbl">{n.label}</span>
              {!!n.count && <span className={n.red ? "count r" : "count"} aria-label={n.red ? `${n.count} proven holes` : `${n.count} contradictions`}>{n.count}</span>}
            </a>
          ))}
        </nav>
        <div className="rail-foot">
          {r && (
            <div className="meter" aria-label={`Muse Spark usage in the latest ${domain} report`}>
              <span className="k"><Sparkles size={12} aria-hidden="true" />Muse Spark tokens</span>
              <span className="v">{int(r.stats.tokens)}</span>
              <span className="s">{r.stats.llm_calls ? `${r.stats.llm_calls} calls · ${r.run.model || "muse"}` : "offline run, no Muse calls"}</span>
            </div>
          )}
          <span className="proto"><Database size={11} aria-hidden="true" />
            {load.loading ? "Loading latest report…" : r ? `${domain} report · ${when(r.run.started)}` : load.error?.status === 404 ? `No ${domain} report yet` : "API not reachable"}
          </span>
        </div>
      </aside>
      <main className="main" id="main" tabIndex={-1}>
        <div className="halo" aria-hidden="true" />
        <div key={path + state} style={{ display: "contents" }}>{page}</div>
      </main>
      <details className="states">
        <summary>Prototype states</summary>
        <div className="box" role="radiogroup" aria-label="Data state">
          <span className="hd">Data shown on every screen</span>
          {[["adjudicated", "Fixture, gold-adjudicated (0 A · 15 B · 2 C)"], ["raw", "Fixture before adjudication (15 A · 2 C)"], ["empty", "Report with no findings"], ["loading", "Loading"], ["error", "API not reachable / audit fails"]].map(([k, l]) => (
            <label key={k}><input type="radio" name="st" checked={state === k} onChange={() => setState(k)} />{l}</label>
          ))}
        </div>
      </details>
    </div>
  );
}

/* ── Audit ──────────────────────────────────────────── */
const ABOUT = {
  airline: { label: "τ² Airline", desc: "Flight bookings, cabin changes, bags, cancellations and refunds.", tools: ["book_reservation", "update_reservation_flights", "update_reservation_baggages", "cancel_reservation", "send_certificate"] },
  retail: { label: "τ² Retail", desc: "Orders, exchanges, returns and address changes for an online store.", tools: ["cancel_pending_order", "exchange_delivered_order_items", "return_delivered_order_items", "modify_pending_order_items"] },
};
const PHASES = [
  { key: "compile", label: "Compiling policy", detail: "policy text → tool rules and forbidden goals", effort: "high reasoning" },
  { key: "search", label: "Searching", detail: "chains of allowed write calls, depth ≤ 4", effort: "high reasoning" },
  { key: "verify", label: "Verifying", detail: "every hit replayed 5 times on a fresh DB", effort: "" },
  { key: "amend", label: "Amending", detail: "one policy sentence and a rule patch per hole", effort: "high reasoning" },
  { key: "backtest", label: "Backtesting", detail: "gold tasks replayed through the patched rules", effort: "" },
];

function Audit({ domain, onDomain, failRun }) {
  const [useLlm, setUseLlm] = useState(true);
  const [amend, setAmend] = useState(true);
  const [budget, setBudget] = useState(2000);
  const [run, setRun] = useState({ events: [], status: "idle", useLlm: true });
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  // Prototype: replays the fixture events on a timer instead of the SSE stream.
  const start = (llm = useLlm) => {
    timers.current.forEach(clearTimeout);
    setUseLlm(llm);
    setRun({ events: [], status: "starting", useLlm: llm });
    const evs = failRun ? [...(llm ? MUSE_EVENTS : EVENTS).slice(0, 2), { phase: "error", message: "Muse Spark answered 429: rate limited", muse: false, tokens: 98400, llm_calls: 3, tool_calls: 0, holes: 0, t: 22.0 }]
      : (llm ? MUSE_EVENTS : EVENTS).filter((e) => amend || (e.phase !== "amend" && e.phase !== "backtest"));
    const gap = reduced() ? 0 : 750;
    evs.forEach((ev, i) => timers.current.push(setTimeout(() => setRun((r) => ({
      ...r, events: [...r.events, ev],
      status: ev.phase === "done" ? "done" : ev.phase === "error" ? "error" : "running",
      error: ev.phase === "error" ? ev.message : r.error,
    })), 300 + i * gap)));
  };

  const busy = run.status === "starting" || run.status === "running";
  const last = run.events.at(-1);
  const seen = new Set(run.events.map((e) => e.phase));
  const order = PHASES.map((p) => p.key);
  const current = [...run.events].reverse().find((e) => order.includes(e.phase))?.phase;
  const phases = PHASES.map((p) => {
    const i = order.indexOf(p.key);
    const reached = seen.has(p.key);
    const passed = run.status === "done" || (current !== undefined && order.indexOf(current) > i);
    const state = reached && passed ? "done" : reached ? (run.status === "error" ? "stopped" : "active") : run.status === "done" || passed ? "skipped" : "idle";
    return { ...p, state, muse: run.events.some((e) => e.phase === p.key && e.muse) };
  });

  return (
    <div className="page">
      <div className="head">
        <div>
          <h1 className="title">Audit a <span className="v">policy</span></h1>
          <p className="lede">Bylaw compiles the agent's policy into rules, searches for chains of allowed tool calls that reach a forbidden outcome, and proves each one in the τ²-bench simulator.</p>
        </div>
      </div>

      {run.status === "idle" && (
        <div className="domains" role="radiogroup" aria-label="Domain">
          {["airline", "retail"].map((k) => (
            <button key={k} className="domain" role="radio" aria-checked={domain === k} onClick={() => onDomain(k)}>
              <span className="n">{ABOUT[k].label}{domain === k && <span className="ck"><Check size={15} aria-hidden="true" /></span>}</span>
              <span className="d">{ABOUT[k].desc}</span>
              <span className="tools">{ABOUT[k].tools.map((t) => <code key={t} translate="no">{t}</code>)}</span>
            </button>
          ))}
        </div>
      )}

      <div className="panel runbar">
        <div className="opts">
          {run.status !== "idle" && <span>Domain <b>{ABOUT[domain].label}</b>{!busy && <> · <button className="link" onClick={() => setRun({ events: [], status: "idle", useLlm })}>change</button></>}</span>}
          <label className="opt"><input type="checkbox" checked={useLlm} disabled={busy} onChange={(e) => setUseLlm(e.target.checked)} />Use Muse Spark</label>
          <label className="opt"><input type="checkbox" checked={amend} disabled={busy} onChange={(e) => setAmend(e.target.checked)} />Draft amendments</label>
          <label className="opt">Budget
            <input className="num-in" type="number" name="budget" autoComplete="off" inputMode="numeric" min={10} max={20000} step={100} value={budget} disabled={busy} onChange={(e) => setBudget(Math.max(10, Number(e.target.value) || 0))} />
            tool calls
          </label>
        </div>
        {run.status === "done"
          ? <a className="btn primary" href={`#/${domain}/report`}>Open report <ArrowRight size={16} aria-hidden="true" /></a>
          : <button className="btn primary" onClick={() => start()} disabled={busy}>
              {busy ? <Loader2 size={16} className="spin" aria-hidden="true" /> : <Play size={16} aria-hidden="true" />}{busy ? "Auditing…" : "Run audit"}
            </button>}
      </div>

      {run.status === "error" && (
        <div className="notice" role="alert">
          <AlertTriangle size={18} aria-hidden="true" />
          <div>
            <b>The audit stopped.</b>
            <p>{run.error}</p>
            <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
              <button className="btn sm" onClick={() => start(run.useLlm)}><RotateCcw size={14} aria-hidden="true" />Retry</button>
              {run.useLlm && <button className="btn sm" onClick={() => start(false)}>Run without Muse</button>}
            </div>
          </div>
        </div>
      )}

      <section className="panel beam" aria-label="Audit progress">
        <div className="phases">
          {phases.map((p, i) => (
            <div key={p.key} className={`phase ${p.state}`} aria-current={p.state === "active" ? "step" : undefined}>
              <span className="st">
                {p.state === "done" ? <Check size={14} aria-hidden="true" /> : p.state === "active" ? <Loader2 size={14} className="spin" aria-hidden="true" /> : p.state === "skipped" ? <Minus size={14} aria-hidden="true" /> : <span className="n">{i + 1}</span>}
                {p.state === "idle" ? "waiting" : p.state === "active" ? "running" : p.state}
              </span>
              <span className="nm">{p.label}</span>
              <span className="dt">{p.detail}</span>
              {p.muse && <span><Muse>{p.effort ? `Muse Spark · ${p.effort}` : "Muse Spark"}</Muse></span>}
              <span className="bar"><i /></span>
            </div>
          ))}
        </div>
      </section>

      <div className="live">
        <section className="panel" aria-label="Run log">
          <div className="panel-h"><h2>Run log</h2><span className="label">{run.status === "idle" ? "idle" : busy ? "live" : run.status === "done" ? "finished" : "stopped"}</span></div>
          <div className="log" aria-live="polite">
            {run.status === "idle" && <span>Pick a domain and run the audit. Progress shows here.</span>}
            {run.status === "starting" && <span>Starting the audit…</span>}
            {run.events.slice(-9).map((e, i) => (
              <span key={run.events.length - i + e.t} className={e.phase === "error" ? "bad" : e.phase === "done" ? "ok" : e.muse ? "mu" : ""}>
                {e.t.toFixed(1).padStart(6)}s  {e.phase.padEnd(8)} {e.message}
              </span>
            ))}
          </div>
        </section>
        <section className="panel beam tokens" aria-label="Counters">
          <Muse>Muse Spark tokens</Muse>
          <span className="big">{int(last?.tokens ?? 0)}</span>
          <span className="row">Tool calls <b className="num">{int(last?.tool_calls ?? 0)} / {int(budget)}</b></span>
          <span className="row">LLM calls <b className="num">{int(last?.llm_calls ?? 0)}</b></span>
          <span className="row">Holes proven <b className="num" style={{ color: last?.holes ? "var(--red)" : undefined }}>{int(last?.holes ?? 0)}</b></span>
        </section>
      </div>
    </div>
  );
}

/* ── Report ─────────────────────────────────────────── */
const CLASS_C_NOTE = "Cancel and rebook inside a permitted cancel ground is the method the policy allows. Listed for review, not counted.";

function ReportView({ domain, load, ratified, onRetry }) {
  const crumbs = <Crumbs items={[["Audit", "#/"], [`${domain} report`]]} />;
  if (load.loading) return <div className="page">{crumbs}<Loading what={`the latest ${domain} report`} /></div>;
  if (load.error?.status === 404)
    return (
      <div className="page">
        {crumbs}
        <h1 className="title">No {domain} report yet</h1>
        <section className="panel beam empty-state">
          <span className="shield"><FileSearch size={30} aria-hidden="true" /></span>
          <h2 className="h2">Run an audit to see which chains of allowed calls break the {domain} policy</h2>
          <a className="btn primary" href="#/">Run an audit</a>
        </section>
      </div>
    );
  if (!load.data) return <div className="page">{crumbs}<Failure onRetry={onRetry} /></div>;

  const { run, holes, ambiguities, stats } = load.data;
  const contradictions = load.data.contradictions ?? [];
  const paid = holes.reduce((a, h) => a + h.money_delta, 0);
  const all = [...holes, ...contradictions];
  const goalCount = new Set(holes.map((h) => h.goal)).size;
  const fixed = new Set(Object.keys(ratified));

  return (
    <div className="page">
      {crumbs}
      <div className="head">
        <div>
          <h1 className="title">
            {holes.length ? <><span className="r">{holes.length} proven {holes.length === 1 ? "hole" : "holes"}</span> in the {domain} policy</> : <>No proven holes in the {domain} policy</>}
          </h1>
          <p className="lede">
            {holes.length
              ? "Every hole below is a chain of tool calls the policy allows, one by one, that ends in an outcome the policy forbids, and that no gold task of the benchmark takes. Each was replayed five times on a fresh database."
              : "A hole is a chain of tool calls the policy allows, one by one, that ends in an outcome the policy forbids, and that no gold task of the benchmark takes. This run proved none."}
            {contradictions.length > 0 && ` ${contradictions.length} ${contradictions.length === 1 ? "finding is" : "findings are"} a contradiction instead: the policy text forbids the outcome, but τ²'s own gold tasks reach it.`}
          </p>
        </div>
        <div className="tags">
          {run.mode === "muse" ? <><Muse>Rules compiled by Muse Spark</Muse><Muse>Chains proposed by Muse Spark</Muse></> : <span className="tag">Offline run · hand RuleSet, blind BFS</span>}
          {all.some((h) => h.amendment) && <Muse>Amendments drafted by Muse Spark</Muse>}
        </div>
      </div>

      <div className="summary">
        <div className="panel stat">
          <span className="label">Run</span>
          <span className="mono" style={{ fontSize: 13 }}>{when(run.started)}{run.commit && ` · ${run.commit.slice(0, 7)}`}</span>
          <span className="s">mode {run.mode}{run.model && ` · model ${run.model}`} · {int(stats.tokens)} tokens</span>
        </div>
        <div className="panel stat"><span className="label">Class A holes</span><span className={`v ${holes.length ? "r" : ""}`}>{holes.length}</span><span className="s">{goalCount} forbidden {goalCount === 1 ? "goal" : "goals"} reached</span></div>
        <div className="panel stat"><span className="label">Policy vs practice</span><span className={`v ${contradictions.length ? "b" : ""}`}>{contradictions.length}</span><span className="s">class B, gold tasks do it too</span></div>
        <div className="panel stat"><span className="label">Search</span><span className="v">{int(stats.tool_calls)}</span><span className="s">tool calls of {int(run.budget)} · {Math.round(stats.seconds)} s</span></div>
      </div>

      {holes.length > 0 && <>
        <p className="section-note"><b>Holes.</b> Net paid out across all of them: {usd(paid)} (refunds minus charges, from the replayed database).</p>
        <Groups domain={domain} entries={holes} fixed={fixed} />
      </>}

      {!holes.length && !contradictions.length && (
        <section className="panel beam empty-state">
          <span className="shield"><ShieldCheck size={32} aria-hidden="true" /></span>
          <h2 className="h2">The search spent its budget without reaching a forbidden outcome</h2>
          <p>{int(stats.chains_tried)} chains over every write tool. This is not a proof that no hole exists. Raise the budget or add forbidden goals, then run the audit again.</p>
          <a className="btn" href="#/">Run another audit</a>
        </section>
      )}

      {contradictions.length > 0 && (
        <section className="practice" aria-labelledby="pvp-h">
          <div>
            <h2 id="pvp-h" className="title sm">Policy vs <span className="b">practice</span></h2>
            <p className="lede">The written policy forbids these outcomes, yet the benchmark's gold tasks reach them and τ² grades them as correct. They are not counted as holes. Each needs a decision: amend the text to match practice, or ratify the rule and accept the gold tasks it blocks.</p>
          </div>
          <Groups domain={domain} entries={contradictions} fixed={fixed} />
        </section>
      )}

      {ambiguities.length > 0 && (
        <section className="panel" aria-labelledby="amb-h">
          <div className="panel-h"><h2 id="amb-h">Ambiguities · class C, not counted</h2><span className="label">{ambiguities.length} listed for review</span></div>
          <p style={{ padding: "14px 20px 6px", color: "var(--muted)", fontSize: 14 }}>{CLASS_C_NOTE}</p>
          <ul className="amb">
            {ambiguities.map((a) => {
              const t = humanize(a.title, a.key);
              return (
                <li key={a.key}><a href={holeHref(domain, a.key)}>
                  <span className="id">{a.id}</span>
                  <span><span className="t">{t.name} <span className="mono" style={{ color: "var(--muted)" }}>{t.target}</span></span><br /><span className="c">{a.chain.map((s) => s.tool).join(" → ")}</span></span>
                  <span className="tag">{a.goal} · {a.replays}</span>
                </a></li>
              );
            })}
          </ul>
        </section>
      )}
    </div>
  );
}

function Groups({ domain, entries, fixed }) {
  const byGoal = new Map();
  for (const h of entries) byGoal.set(h.goal, [...(byGoal.get(h.goal) ?? []), h]);
  return [...byGoal].map(([gid, list]) => {
    const g = GOALS.get(gid);
    const b = list[0].class === "B";
    const tasks = [...new Set(list.flatMap((h) => h.gold?.tasks ?? []))];
    return (
      <section key={gid} className={`goal-group ${b ? "cls-b" : ""}`} aria-labelledby={`g-${gid}-${list[0].class}`}>
        <div className="panel beam gcard">
          <div className="top">
            <span className="id">{gid} · class {list[0].class} · {list.length} {list.length === 1 ? "booking" : "bookings"}</span>
            <i className={b ? "b-mark" : "hole-mark"} aria-hidden="true" />
          </div>
          <h3 id={`g-${gid}-${list[0].class}`}>{g ? humanize(g.name).name : humanize(list[0].title).name}</h3>
          {g && <p className="quote">{quote(g.policy_ref)}</p>}
          {b && tasks.length > 0 && <p className="gold">{goldLine(tasks)}</p>}
        </div>
        <ul className="panel instances">
          {list.map((h) => (
            <li key={h.key}><a href={holeHref(domain, h.key)}>
              <span className="mono k">{h.id}</span>
              <span className="mono t" translate="no">{humanize(h.title, h.key).target}</span>
              <span className="mono c">{h.chain.map((s) => s.tool).join(" → ")}</span>
              <span className={`m ${!b && h.money_delta > 0 ? "out" : ""}`}>{usd(h.money_delta)}</span>
              <span className="rep">{h.replays}</span>
              {fixed.has(h.key) ? <span className="tag green"><Check size={13} aria-hidden="true" />{b ? "Ratified" : "Fixed"}</span> : h.amendment ? <span className="tag muse">Amendment ready</span> : <span />}
              <ArrowRight size={15} aria-hidden="true" />
            </a></li>
          ))}
        </ul>
      </section>
    );
  });
}

/* ── Hole ───────────────────────────────────────────── */
function Missing({ domain, hkey, crumbs }) {
  return (
    <div className="page">
      {crumbs}
      <section className="panel beam empty-state">
        <h1 className="h2">Hole {hkey} is not in the latest {domain} report</h1>
        <p>A newer audit may have replaced the report it came from.</p>
        <a className="btn" href={`#/${domain}/report`}>Open the latest report</a>
      </section>
    </div>
  );
}

function HoleView({ domain, h, hkey, isFixed }) {
  const crumbs = <Crumbs items={[["Report", `#/${domain}/report`], [hkey]]} />;
  if (!h) return <Missing domain={domain} hkey={hkey} crumbs={crumbs} />;
  return <Trace domain={domain} h={h} isFixed={isFixed} crumbs={crumbs} />;
}

function Trace({ domain, h, isFixed, crumbs }) {
  const lines = FX.policy;
  const goal = GOALS.get(h.goal);
  const n = h.chain.length;
  const [at, setAt] = useState(reduced() ? n : -1);
  const [playing, setPlaying] = useState(!reduced());
  const [open, setOpen] = useState(n - 1);
  const { name, target } = humanize(h.title, h.key);
  const [ok, total] = h.replays.split("/").map(Number);
  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setAt((a) => (a >= n ? (setPlaying(false), a) : a + 1)), 900);
    return () => clearInterval(id);
  }, [playing, n]);
  useEffect(() => setOpen(Math.min(Math.max(at, 0), n - 1)), [at, n]);
  const step = (d) => { setPlaying(false); setAt((a) => Math.min(n, Math.max(0, a + d))); };

  return (
    <div className="page">
      {crumbs}
      <div className="head">
        <div>
          <h1 className="title">{name} <span className="mono-t">{target}</span></h1>
          <p className="lede">
            {h.class === "B" ? `Policy vs practice, not counted as a hole: each step passes every rule and together they reach goal ${h.goal}, which the policy text forbids. ${goldLine(h.gold?.tasks ?? [])}`
              : h.class === "C" ? `Class C ambiguity, not counted: each step passes every rule and together they reach goal ${h.goal}, but cancel and rebook inside a permitted cancel ground is the method the policy allows.`
              : `Each step below passes every rule of the policy. Together they reach goal ${h.goal}, an outcome the policy forbids.`}
          </p>
        </div>
        <div className="replay-ctl">
          {h.class === "B" && <span className="tag amber">Class B · contradiction</span>}
          {isFixed ? <span className="tag green"><ShieldCheck size={13} aria-hidden="true" />Fixed and enforced</span>
            : h.amendment ? <a className="btn primary" href={holeHref(domain, h.key, "/amendment")}>Review amendment <ArrowRight size={16} aria-hidden="true" /></a>
            : <span className="tag">{h.class === "C" ? "Class C · listed for review" : "No amendment drafted"}</span>}
        </div>
      </div>

      <div className="detail">
        <section className="panel beam" aria-labelledby="trace-h">
          <div className="panel-h">
            <h2 id="trace-h">Trace replay <span className="label">step {Math.max(0, Math.min(at, n))} of {n}</span></h2>
            <div className="replay-ctl">
              <span className="tag">Hand RuleSet</span>
              <button className="btn sm icon" onClick={() => step(-1)} disabled={at <= 0} aria-label="Previous step"><ChevronLeft size={15} aria-hidden="true" /></button>
              <button className="btn sm" onClick={() => step(1)} disabled={at >= n}>Next step<ChevronRight size={15} aria-hidden="true" /></button>
              <button className="btn sm" onClick={() => { if (reduced()) setAt(n); else { setAt(-1); setPlaying(true); } }}><Play size={14} aria-hidden="true" />Replay</button>
            </div>
          </div>
          <ol className="trace" aria-live="polite">
            {h.chain.map((s, i) => {
              const state = i < at ? "" : i === at ? "current" : "pending";
              return (
                <li key={i} className={`step ${state}`}>
                  <button className="step-h" aria-expanded={state !== "pending" && open === i} disabled={state === "pending"} onClick={() => setOpen(i)}>
                    <span className="i">{String(i + 1).padStart(2, "0")}</span>
                    <Call step={s} />
                    {state !== "pending" && <span className={`verdict ${s.ok ? "ok" : "no"}`}>{s.ok ? <Check size={15} aria-hidden="true" /> : <X size={15} aria-hidden="true" />}{s.ok ? "allowed" : "blocked"}</span>}
                  </button>
                  {state !== "pending" && open !== i && <div className="chips">{s.verdicts.map((v) => <span key={v.rule_id}><Check size={11} aria-hidden="true" />{v.rule_id}</span>)}</div>}
                  {state !== "pending" && open === i && (
                    <div className="rules">
                      {s.verdicts.map((v) => {
                        const ln = lineOf(lines, v.policy_ref);
                        return (
                          <div className="rule" key={v.rule_id}>
                            <Check size={13} aria-label="rule passed" />
                            <span className="rid" translate="no">{v.rule_id}{ln > 0 && <small>policy.md:{ln}</small>}</span>
                            <q>{v.policy_ref}</q>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </li>
              );
            })}
            <li className={`outcome ${h.class === "B" ? "b" : ""} ${at >= n ? "" : "pending"}`}>
              <span className="eq">=</span>
              <code translate="no">{h.goal} {goal?.name ?? name}</code>
              {at >= n && <span className="verdict"><X size={15} aria-hidden="true" />{h.class === "B" ? "forbidden by the text, done by gold" : "forbidden"}</span>}
            </li>
          </ol>
        </section>

        <aside className="side">
          <section className="panel">
            <div className="panel-h"><h2>Proof</h2><span className="tag green">replays {h.replays}</span></div>
            <div className="panel-b" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div className="replays" aria-label={`${h.replays} replays reproduced the outcome`}>
                {Array.from({ length: total || 0 }, (_, i) => <i key={i}>{i < ok ? <Check size={13} aria-hidden="true" /> : <X size={13} aria-hidden="true" />}</i>)}
                <span className="label" style={{ marginLeft: 6 }}>same DB diff on a fresh env</span>
              </div>
              <div className={`money ${h.class === "A" ? "" : "neutral"}`}>
                <b>{usd(h.money_delta)}</b>
                <span>{h.money_delta > 0 ? "net paid out to the customer by this chain" : h.money_delta < 0 ? "net charged to the customer; the forbidden change itself is the harm" : "no money moves; the forbidden change itself is the harm"}</span>
              </div>
            </div>
          </section>
          <section className="panel">
            <div className="panel-h"><h2>Forbidden goal</h2><span className="label">{h.goal}</span></div>
            <div className="panel-b" style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {goal && <>
                <div className="paper"><div className="src">policy.md{lineOf(lines, goal.policy_ref) > 0 && `:${lineOf(lines, goal.policy_ref)}`}</div><p className="quote">{quote(goal.policy_ref)}</p></div>
                <code className="pred" translate="no">{goal.name}</code>
              </>}
            </div>
          </section>
          <section className="panel">
            <div className="panel-h"><h2>Database diff</h2><span className="label">before → after</span></div>
            <div className="panel-b">
              {Object.entries(h.diff).flatMap(([coll, recs]) => Object.entries(recs).map(([rid, c]) => (
                <table className="difft" key={coll + rid}>
                  <thead><tr><th colSpan={2}>{coll}.{rid}{!c.before ? " (created)" : !c.after ? " (deleted)" : ""}</th></tr></thead>
                  <tbody>{changedFields(c).map(([k, b, a]) => <tr key={k}><td>{k}</td><td><span className="was">{b}</span> → <span className="now">{a}</span></td></tr>)}</tbody>
                </table>
              )))}
            </div>
          </section>
        </aside>
      </div>
    </div>
  );
}

/* ── Amendment ──────────────────────────────────────── */
function AmendmentView({ domain, h, hkey, ratified, onRatify }) {
  const [busy, setBusy] = useState(false); // before any early return
  const crumbs = <Crumbs items={[["Report", `#/${domain}/report`], [hkey, holeHref(domain, hkey)], ["Amendment"]]} />;
  if (!h) return <Missing domain={domain} hkey={hkey} crumbs={crumbs} />;
  const a = h.amendment;
  const done = ratified[h.key];
  const goal = GOALS.get(h.goal);
  const { name } = humanize(h.title, h.key);
  if (!a) return (
    <div className="page">{crumbs}
      <section className="panel beam empty-state">
        <h1 className="h2">No amendment was drafted for {h.key}</h1>
        <p>Run the audit again with “Draft amendments” on. Muse Spark writes one policy sentence and a rule patch for each proven hole.</p>
        <a className="btn" href="#/">Run an audit</a>
      </section>
    </div>
  );
  const bt = h.backtest, isB = h.class === "B", goldTasks = h.gold?.tasks ?? [];
  const ln = goal ? lineOf(FX.policy, goal.policy_ref) : 0;
  const ratify = () => { setBusy(true); setTimeout(() => { onRatify(h.key); setBusy(false); }, reduced() ? 0 : 700); };

  return (
    <div className="page">
      {crumbs}
      <div className="head">
        <div>
          <h1 className="title">{done ? <>Hole {h.id} <span className="g">closed</span></> : <>Amendment <span className="v">{a.id}</span> for {h.id}</>}</h1>
          <p className="lede">
            {isB ? `This finding is a contradiction: the policy text forbids ${name.toLowerCase()}, but ${goldLine(goldTasks, "the benchmark's gold does it in").slice(0, -1)}. Ratifying the rule makes the written policy win over practice.`
              : `A sentence for the policy and the rule that enforces it, so that the trace for ${name.toLowerCase()} no longer passes. Past gold tasks were replayed to count the honest customers it would also stop.`}
          </p>
        </div>
        <Muse>Drafted by Muse Spark · high reasoning</Muse>
      </div>
      <div className="amend">
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          <section className="diffdoc" aria-label="Policy diff">
            <div className="src"><span>policy.md{ln > 0 && `:${ln}`}</span><span>amendment {a.id}</span></div>
            {goal && <p className="ctx"><span className="m"> </span><span style={{ whiteSpace: "pre-line" }}>{quote(goal.policy_ref)}</span></p>}
            <p className="plus"><span className="m">+</span><span>{a.policy_text}</span></p>
          </section>
          <section className="panel">
            <div className="panel-h"><h2>Rule patch</h2><span className="label">{a.rule_patch.length} {a.rule_patch.length === 1 ? "rule" : "rules"} added</span></div>
            <div className="panel-b" style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {a.rule_patch.map((r) => (
                <pre className="code" key={r.id} translate="no"><span className="k">+ </span>{`{ "id": "${r.id}",\n    "tool": "${r.tool}",\n    "allow_if": `}<span className="k">{r.allow_if}</span>{`,\n    "policy_ref": "${r.policy_ref}" }`}</pre>
              ))}
              {a.rationale && <p className="rationale"><b>Why:</b> {a.rationale}</p>}
            </div>
          </section>
        </div>
        <aside className="side">
          <div className="metrics">
            <div className="panel metric"><span>gold tasks replayed</span><b>{bt ? int(bt.tasks) : "—"}</b></div>
            <div className="panel metric"><span>{isB ? "gold tasks blocked" : "honest customers blocked"}</span><b>{bt ? int(bt.blocked - bt.baseline_blocked) : "—"}</b></div>
            <div className="panel metric"><span>{isB ? "stops the chain" : "closes the hole"}</span><b>{h.closes === undefined ? "—" : h.closes ? "yes" : "no"}</b></div>
            <div className="panel metric"><span>rules added</span><b>{a.rule_patch.length}</b></div>
          </div>
          {done ? (
            <section className="enforced" role="status">
              <span className="t"><ShieldCheck size={22} aria-hidden="true" />Enforced by MCP proxy</span>
              <div className="flow" aria-label="Your agent calls tools through the Bylaw proxy">
                <span><Bot size={14} aria-hidden="true" />your agent</span><ArrowRight size={14} aria-hidden="true" />
                <span className="px"><Gavel size={14} aria-hidden="true" />bylaw proxy</span><ArrowRight size={14} aria-hidden="true" />
                <span><Wrench size={14} aria-hidden="true" />τ² tools</span>
              </div>
              <p style={{ color: "var(--muted)", fontSize: 14 }}>Ratified {when(done)}. The proxy now refuses calls that fail {a.rule_patch.map((r) => r.id).join(", ")}.</p>
              <a className="btn" href={`#/${domain}/report`}>Back to report</a>
            </section>
          ) : (
            <section className="panel beam ratify-box">
              <h2 className="h2">Ratify this amendment</h2>
              {isB && <p className="tradeoff"><b>Trade-off.</b> {goldLine(goldTasks)} Ratifying forbids it from now on. Ratify only if the written policy should win.</p>}
              {!bt && <p>This amendment was not backtested. Ratify only after reading the rule.</p>}
              <button className="btn ratify" onClick={ratify} disabled={busy}>
                {busy ? <Loader2 size={18} className="spin" aria-hidden="true" /> : <Check size={18} aria-hidden="true" />}{busy ? "Ratifying…" : "Ratify"}
              </button>
            </section>
          )}
        </aside>
      </div>
    </div>
  );
}

/* ── Bench ──────────────────────────────────────────── */
const LABEL = { muse: "Muse-guided", bfs: "Blind BFS" };
const COLOR = { muse: "var(--violet-hi)", bfs: "#8c8a9c" };
const per1k = (h, c) => (c ? (h / c) * 1000 : 0);

function Bench({ domain, broken, loading }) {
  const crumbs = <Crumbs items={[[`${domain} bench`]]} />;
  if (loading) return <div className="page">{crumbs}<Loading what="the bench" /></div>;
  if (broken) return <div className="page">{crumbs}<Failure onRetry={() => {}} /></div>;
  if (domain === "retail") return (
    <div className="page">{crumbs}
      <h1 className="title">No {domain} bench yet</h1>
      <section className="panel beam empty-state">
        <span className="shield"><Gauge size={30} aria-hidden="true" /></span>
        <p>The bench compares Muse-guided search with blind BFS on the same budget. Produce it with <code translate="no">uv run python -m bylaw bench --domain {domain} --budget 2000</code>.</p>
      </section>
    </div>
  );
  const { rows, budget } = BENCH;
  const muse = rows.find((r) => r.mode === "muse"), bfs = rows.find((r) => r.mode === "bfs");
  const max = Math.max(1, ...rows.map((r) => r.holes));
  const ratio = per1k(muse.holes, muse.tool_calls) / per1k(bfs.holes, bfs.tool_calls);
  return (
    <div className="page">
      {crumbs}
      <div className="head">
        <div>
          <h1 className="title"><span className="v">Muse-guided</span> search against blind BFS</h1>
          <p className="lede">Same {domain} policy, same budget of {int(budget)} tool calls, same depth limit. Muse Spark proposes chains per forbidden goal before BFS fills the rest of the budget.</p>
        </div>
        <Muse>Chains proposed by Muse Spark · high reasoning</Muse>
      </div>
      <div className="bench">
        <section className="panel beam">
          <div className="panel-h">
            <h2>Holes proven by tool calls spent <span className="label">(log scale)</span></h2>
            <div className="legend">{rows.map((r) => <span key={r.mode}><i style={{ background: COLOR[r.mode] }} />{LABEL[r.mode]}</span>)}</div>
          </div>
          <div className="chart"><Curve rows={rows} budget={budget} max={max} /></div>
        </section>
        <aside className="side">
          <section className="panel beam ratio">
            <span className="label">Holes per tool call</span>
            <span className="big">{ratio.toFixed(1)}×</span>
            <span style={{ color: "var(--muted)", fontSize: 14 }}>more with Muse on the same budget.</span>
          </section>
        </aside>
      </div>
      <section className="panel" style={{ overflowX: "auto" }}>
        <table className="btable">
          <caption className="sr-only">Bench results by mode</caption>
          <thead><tr><th>Mode</th><th>Holes found</th><th>Tool calls</th><th>Holes per 1,000 calls</th><th>LLM calls</th><th>Tokens</th><th>Wall time</th></tr></thead>
          <tbody>{rows.map((r) => (
            <tr key={r.mode}><td><b style={{ color: COLOR[r.mode] }}>{LABEL[r.mode]}</b></td><td>{r.holes}</td><td>{int(r.tool_calls)}</td><td>{per1k(r.holes, r.tool_calls).toFixed(2)}</td><td>{int(r.llm_calls)}</td><td>{int(r.tokens)}</td><td>{r.seconds.toFixed(1)} s</td></tr>
          ))}</tbody>
        </table>
      </section>
    </div>
  );
}

const W = 720, H = 300, L = 40, B = 28, T = 14, R = 70;
function Curve({ rows, budget, max }) {
  const x = (c) => L + ((Math.log10(Math.max(c, 10)) - 1) / (Math.log10(Math.max(budget, 100)) - 1)) * (W - L - R);
  const y = (h) => H - B - (h / max) * (H - B - T);
  const ticks = [10, 100, 1000, budget].filter((c, i, a) => c <= budget && a.indexOf(c) === i);
  const path = (f) => {
    let d = `M${x(10)},${y(0)}`;
    [...f].sort((a, b) => a.tool_calls - b.tool_calls).forEach((p, i) => (d += ` H${x(p.tool_calls)} V${y(i + 1)}`));
    return d + ` H${x(budget)}`;
  };
  const first = (r) => Math.min(...(r.found ?? []).map((f) => f.tool_calls));
  const summary = rows.map((r) => `${LABEL[r.mode]} proves ${r.holes} holes${r.found?.length ? `, the first at call ${first(r)}` : ""}`).join("; ");
  const muse = rows.find((r) => r.mode === "muse");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={summary}>
      <defs>
        <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#9152ff" stopOpacity=".38" /><stop offset="1" stopColor="#9152ff" stopOpacity="0" /></linearGradient>
        <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
      </defs>
      {[0, Math.round(max / 2), max].map((h) => (
        <g key={h}><line x1={L} x2={W - R} y1={y(h)} y2={y(h)} stroke="rgba(255,255,255,.08)" strokeDasharray={h ? "3 4" : undefined} /><text x={L - 10} y={y(h) + 4} textAnchor="end">{h}</text></g>
      ))}
      {ticks.map((c) => <text key={c} x={x(c)} y={H - 6} textAnchor="middle">{int(c)}</text>)}
      {muse && <path d={path(muse.found) + ` V${y(0)} Z`} fill="url(#area)" />}
      {rows.map((r) => (
        <g key={r.mode}>
          <path className="draw" d={path(r.found ?? [])} fill="none" stroke={COLOR[r.mode]} strokeWidth={r.mode === "muse" ? 3 : 2} filter={r.mode === "muse" ? "url(#glow)" : undefined} />
          <text x={x(budget) + 8} y={y(r.found?.length ?? 0) + 4} style={{ fill: COLOR[r.mode], fontWeight: 700 }}>{r.found?.length ?? 0} {r.mode}</text>
        </g>
      ))}
    </svg>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
