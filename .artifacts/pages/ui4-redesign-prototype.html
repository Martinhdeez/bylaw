            <button key={k} className="domain" role="radio" aria-checked={domain === k} onClick={() => onDomain(k)}>
              <span className="dk">Docket {k === "airline" ? "01" : "02"}</span>
              <span className="n">{ABOUT[k].label}{domain === k && <span className="ck"><Check aria-hidden="true" /></span>}</span>
              <span className="d">{ABOUT[k].desc}</span>
              <span className="tools">{ABOUT[k].tools.map((t) => <code key={t} translate="no">{t}</code>)}</span>
            </button>
          ))}
        </div>
      )}

      <div className="panel runbar">
        <span className={run.status === "done" ? "tape done" : "tape"} style={{ "--f": run.status === "done" ? 1 : (phases.filter((p) => p.state === "done").length + (busy ? 0.5 : 0)) / PHASES.length * (run.status === "idle" ? 0 : 1) }} aria-hidden="true" />
        
        <div className="opts">
          {run.status !== "idle" && <span>Domain <b>{ABOUT[domain].label}</b>{!busy && <> · <button className="link" onClick={() => setRun({ events: [], status: "idle", useLlm })}>change</button></>}</span>}
          <label className="opt"><input type="checkbox" checked={useLlm} disabled={busy} onChange={(e) => setUseLlm(e.target.checked)} />Use Muse Spark</label>
          <label className="opt"><input type="checkbox" checked={amend} disabled={busy} onChange={(e) => setAmend(e.target.checked)} />Draft amendments</label>
          <label className="opt">Budget
            <input className="num-in" type="number" name="budget" autoComplete="off" inputMode="numeric" min={10} max={20000} step={100} value={budget} disabled={busy} onChange={(e) => setBudget(Math.max(10, Number(e.target.value) || 0))} />
            tool calls
          </label>
        </div>
        {run.status === "done"
          ? <a className="btn primary" href={`#/${domain}/report`}>Open report <span className="ic"><ArrowRight aria-hidden="true" /></span></a>
          : <button className="btn primary" onClick={() => start()} disabled={busy}>
              {busy ? "Auditing…" : "Run audit"}<span className="ic">{busy ? <Loader2 className="spin" aria-hidden="true" /> : <Play aria-hidden="true" />}</span>
            </button>}
      </div>

      {run.status === "error" && (
        <div className="notice" role="alert">
          <AlertTriangle aria-hidden="true" />
          <div>
            <b>The audit stopped.</b>
            <p>{run.error}. Retry, or run without Muse to use the hand RuleSet and blind BFS.</p>
            <div className="acts">
              <button className="btn sm" onClick={() => start(run.useLlm)}><RotateCcw aria-hidden="true" />Retry</button>
              {run.useLlm && <button className="btn sm" onClick={() => start(false)}>Run without Muse</button>}
            </div>
          </div>
        </div>
      )}

      <section className="panel" aria-label="Audit progress">
        <div className="phases">
          {phases.map((p, i) => (
            <div key={p.key} className={`phase ${p.state}`} aria-current={p.state === "active" ? "step" : undefined}>
              <span className="st">
                <span className="art">Art. {"I II III IV V".split(" ")[i]}</span>
                {p.state === "done" ? <Check aria-hidden="true" /> : p.state === "active" ? <Loader2 className="spin" aria-hidden="true" /> : p.state === "skipped" ? <Minus aria-hidden="true" /> : null}
                {p.state === "idle" ? "waiting" : p.state === "active" ? "running" : p.state}
              </span>
              <span className="nm">{p.label}</span>
              <span className="dt">{p.detail}</span>
              {p.muse && <span><Muse live={p.state === "active"}>{p.effort ? `Muse Spark, ${p.effort}` : "Muse Spark"}</Muse></span>}
              <span className="bar"><i /></span>
            </div>
          ))}
        </div>
      </section>

      <div className="live">
        <section className="panel" aria-label="Run log">
          <div className="panel-h"><h2>Run log</h2><Status run={run} /></div>
          <div className="log" aria-live="polite">
            {run.status === "idle" && <span>Pick a domain and run the audit. Progress shows here.</span>}
            {run.events.slice(-9).map((e, i) => (
              <span key={e.t + e.phase} className={e.phase === "error" ? "bad" : e.phase === "done" ? "ok" : e.muse ? "mu" : ""}>
                <span className="ts">{e.t.toFixed(1).padStart(6)}s</span>  {e.phase.padEnd(8)} {e.message}
              </span>
            ))}
            {busy && <span><span className="caret" /></span>}
          </div>
        </section>
        <section className="panel tokens" aria-label="Counters">
          <Muse live={busy && useLlm}>Muse Spark tokens</Muse>
          <Ticker className="big" value={last?.tokens ?? 0} />
          <div className="rows">
            <span className="row">Tool calls <b><Ticker value={last?.tool_calls ?? 0} /> / {int(budget)}</b></span>
            <span className="row">LLM calls <b><Ticker value={last?.llm_calls ?? 0} /></b></span>
            <span className="row">Holes proven <b style={{ color: last?.holes ? "var(--red)" : undefined }}><Ticker value={last?.holes ?? 0} /></b></span>
          </div>
        </section>
      </div>
    </div>
  );
}

/* ── Report ─────────────────────────────────────────── */
const CLASS_C_NOTE = "Cancel and rebook inside a permitted cancel ground is the method the policy allows. Listed for review, not counted.";

function ReportView({ domain, load, ratified, onRetry }) {
  const crumbs = <Crumbs items={[["Audit", "#/"], [`${domain} report`]]} />;
  if (load.loading) return <div className="page">{crumbs}<Loading what={`the latest ${domain} report`} /></div>;
  if (load.error?.status === 404)
    return (
      <div className="page">
        {crumbs}
        <h1 className="title">No {domain} report yet</h1>
        <section className="panel empty-state">
          <span className="shield"><FileSearch aria-hidden="true" /></span>
          <h2 className="h2">Run an audit to see which chains of allowed calls break the {domain} policy</h2>
          <p>An audit compiles the policy, searches up to the budget and proves every hit five times.</p>
          <a className="btn primary" href="#/">Run an audit<span className="ic"><ArrowRight aria-hidden="true" /></span></a>
        </section>
      </div>
    );
  if (!load.data) return <div className="page">{crumbs}<Failure onRetry={onRetry} /></div>;

  const { run, holes, ambiguities, stats } = load.data;
  const contradictions = load.data.contradictions ?? [];
  const paid = holes.reduce((a, h) => a + h.money_delta, 0);
  const all = [...holes, ...contradictions];
  const goalCount = new Set(holes.map((h) => h.goal)).size;
  const fixed = new Set(Object.keys(ratified));

  return (
    <div className="page">
      {crumbs}
      <div className="head">
        <div>
          <h1 className="title">
            {holes.length ? <><span className="r">{holes.length} proven {holes.length === 1 ? "hole" : "holes"}</span> in the {domain} policy</> : <>No proven holes in the {domain} policy</>}
          </h1>
          <p className="lede">
            {holes.length
              ? "Every hole below is a chain of tool calls the policy allows, one by one, that ends in an outcome the policy forbids, and that no gold task of the benchmark takes. Each was replayed five times on a fresh database."
              : "A hole is a chain of tool calls the policy allows, one by one, that ends in an outcome the policy forbids, and that no gold task of the benchmark takes. This run proved none."}
            {contradictions.length > 0 && ` ${contradictions.length} ${contradictions.length === 1 ? "finding is" : "findings are"} a contradiction instead: the policy text forbids the outcome, but τ²'s own gold tasks reach it.`}
          </p>
        </div>
        <div className="tags">
          {run.mode === "muse" ? <><Muse>Rules compiled by Muse Spark</Muse><Muse>Chains proposed by Muse Spark</Muse></> : <span className="tag">Offline run: hand RuleSet, blind BFS</span>}
          {all.some((h) => h.amendment) && <Muse>Amendments drafted by Muse Spark</Muse>}
        </div>
      </div>

      <div className="summary">
        <div className="panel stat">
          <span className="label">Run</span>
          <span className="mono" style={{ fontSize: 13 }}>{when(run.started)}{run.commit && ` · ${run.commit.slice(0, 7)}`}</span>
          <span className="s">mode {run.mode}{run.model && `, model ${run.model}`}, {int(stats.tokens)} tokens</span>
        </div>
        <div className="panel stat"><span className="label">Class A holes</span><Ticker className={`v ${holes.length ? "r" : ""}`} value={holes.length} /><span className="s">{goalCount} forbidden {goalCount === 1 ? "goal" : "goals"} reached</span></div>
        <div className="panel stat"><span className="label">Policy vs practice</span><Ticker className={`v ${contradictions.length ? "b" : ""}`} value={contradictions.length} /><span className="s">class B, gold tasks do it too</span></div>
        <div className="panel stat"><span className="label">Search</span><Ticker className="v" value={stats.tool_calls} /><span className="s">tool calls of {int(run.budget)} in {Math.round(stats.seconds)} s</span></div>
      </div>

      {holes.length > 0 && <>
        <p className="section-note"><b>Holes.</b> Net paid out across all of them: {usd(paid)} (refunds minus charges, from the replayed database).</p>
        <Groups domain={domain} entries={holes} fixed={fixed} />
      </>}

      {!holes.length && !contradictions.length && (
        <section className="panel empty-state">
          <span className="shield"><ShieldCheck aria-hidden="true" /></span>
          <h2 className="h2">The search spent its budget without reaching a forbidden outcome</h2>
          <p>{int(stats.chains_tried)} chains over every write tool. This is not a proof that no hole exists. Raise the budget or add forbidden goals, then run the audit again.</p>
          <a className="btn" href="#/">Run another audit</a>
        </section>
      )}

      {contradictions.length > 0 && (
        <section className="practice" aria-labelledby="pvp-h">
          <div>
            <h2 id="pvp-h" className="title sm">Policy vs <span className="b">practice</span></h2>
            <p className="lede">The written policy forbids these outcomes, yet the benchmark's gold tasks reach them and τ² grades them as correct. They are not counted as holes. Each needs a decision: amend the text to match practice, or ratify the rule and accept the gold tasks it blocks.</p>
          </div>
          <Groups domain={domain} entries={contradictions} fixed={fixed} />
        </section>
      )}

      {ambiguities.length > 0 && (
        <section className="panel" aria-labelledby="amb-h">
          <div className="panel-h"><h2 id="amb-h">Ambiguities, class C, not counted</h2><span className="label">{ambiguities.length} listed for review</span></div>
          <p style={{ padding: "16px 20px 8px", color: "var(--muted)", fontSize: 14 }}>{CLASS_C_NOTE}</p>
          <ul className="amb">
            {ambiguities.map((a) => {
              const t = humanize(a.title, a.key);
              return (
                <li key={a.key}><a href={holeHref(domain, a.key)}>
                  <span className="id">{a.id}</span>
                  <span><span className="t">{t.name} <span className="mono" style={{ color: "var(--muted)" }}>{t.target}</span></span><br /><span className="c">{a.chain.map((s) => s.tool).join(" → ")}</span></span>
                  <span className="tag">{a.goal}, {a.replays}</span>
                </a></li>
              );
            })}
          </ul>
        </section>
      )}
    </div>
  );
}

function Groups({ domain, entries, fixed }) {
  const byGoal = new Map();
  for (const h of entries) byGoal.set(h.goal, [...(byGoal.get(h.goal) ?? []), h]);
  return [...byGoal].map(([gid, list]) => {
    const g = GOALS.get(gid);
    const b = list[0].class === "B";
    const tasks = [...new Set(list.flatMap((h) => h.gold?.tasks ?? []))];
    return (
      <section key={gid} className={`goal-group ${b ? "cls-b" : ""}`} aria-labelledby={`g-${gid}-${list[0].class}`}>
        <div className="panel gcard">
          <div className="top">
            <span className="id">{gid} · class {list[0].class} · {list.length} {list.length === 1 ? "booking" : "bookings"}</span>
            <i className={b ? "b-mark" : "hole-mark"} aria-hidden="true" />
          </div>
          <h3 id={`g-${gid}-${list[0].class}`}>{g ? humanize(g.name).name : humanize(list[0].title).name}</h3>
          {g && <p className="quote">{quote(g.policy_ref)}</p>}
          {b && tasks.length > 0 && <p className="gold">{goldLine(tasks)}</p>}
        </div>
        <ul className="panel instances">
          {list.map((h, i) => {
            const chain = h.chain.map((s) => s.tool).join(" → ");
            return (
              <li key={h.key} style={{ "--i": i }}><a href={holeHref(domain, h.key)}>
                <span className="mono k">{h.id}</span>
                <span className="mono t" translate="no">{humanize(h.title, h.key).target}</span>
                <span className="mono c" title={chain}>{chain}</span>
                <span className={`m ${!b && h.money_delta > 0 ? "out" : ""}`}>{usd(h.money_delta)}</span>
                <span className="rep">{h.replays}</span>
                {fixed.has(h.key) ? <span className="tag stamped">{b ? "Ratified" : "Fixed"}</span> : h.amendment ? <span className="tag muse">Amendment ready</span> : <span />}
                <ArrowRight aria-hidden="true" />
              </a></li>
            );
          })}
        </ul>
      </section>
    );
  });
}

/* ── Hole ───────────────────────────────────────────── */
function Missing({ domain, hkey, crumbs }) {
  return (
    <div className="page">
      {crumbs}
      <section className="panel empty-state">
        <span className="shield"><FileSearch aria-hidden="true" /></span>
        <h1 className="h2">Hole {hkey} is not in the latest {domain} report</h1>
        <p>A newer audit may have replaced the report it came from.</p>
        <a className="btn" href={`#/${domain}/report`}>Open the latest report</a>
      </section>
    </div>
  );
}

function HoleView({ domain, h, hkey, isFixed }) {
  const crumbs = <Crumbs items={[["Report", `#/${domain}/report`], [hkey]]} />;
  if (!h) return <Missing domain={domain} hkey={hkey} crumbs={crumbs} />;
  return <Trace domain={domain} h={h} isFixed={isFixed} crumbs={crumbs} />;
}

function Trace({ domain, h, isFixed, crumbs }) {
  const lines = FX.policy;
  const goal = GOALS.get(h.goal);
  const n = h.chain.length;
  const [at, setAt] = useState(reduced() ? n : -1);
  const [playing, setPlaying] = useState(!reduced());
  const [open, setOpen] = useState(n - 1);
  const list = useRef(null);
  const { name, target } = humanize(h.title, h.key);
  const [ok, total] = h.replays.split("/").map(Number);

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setAt((a) => (a >= n ? (setPlaying(false), a) : a + 1)), 1100);
    return () => clearInterval(id);
  }, [playing, n]);
  useEffect(() => setOpen(Math.min(Math.max(at, 0), n - 1)), [at, n]);
  const step = (d) => { setPlaying(false); setAt((a) => Math.min(n, Math.max(0, a + d))); };
  const replay = () => { if (reduced()) setAt(n); else { setAt(-1); setPlaying(true); } };
  useEffect(() => {
    const on = (e) => {
      if (e.target.closest?.("input, textarea, dialog")) return;
      if (e.key === "ArrowRight") step(1);
      if (e.key === "ArrowLeft") step(-1);
    };
    addEventListener("keydown", on);
    return () => removeEventListener("keydown", on);
  }, []);
  // The cursor sits on the current node; the fill runs from the first node to it. One layout read per step.
  useLayoutEffect(() => {
    const ol = list.current;
    const measure = () => {
      const nodes = ol.querySelectorAll(".node");
      const track = ol.querySelector(".track");
      const k = Math.min(Math.max(at, 0), n);
      const node = nodes[k];
      if (!node || !track) return;
      const o = ol.getBoundingClientRect(), t = track.getBoundingClientRect(), r = node.getBoundingClientRect();
      const y = r.top + r.height / 2 - o.top;
      ol.style.setProperty("--y", `${y}px`);
      ol.style.setProperty("--p", at < 0 ? 0 : Math.max(0, Math.min(1, (r.top + r.height / 2 - t.top) / t.height)));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(ol);
    return () => ro.disconnect();
  }, [at, open, n]);

  return (
    <div className="page">
      {crumbs}
      <div className="head">
        <div>
          <h1 className="title">{name} <span className="mono-t">{target}</span></h1>
          <p className="lede">
            {h.class === "B" ? `Policy vs practice, not counted as a hole: each step passes every rule and together they reach goal ${h.goal}, which the policy text forbids. ${goldLine(h.gold?.tasks ?? [])}`
              : h.class === "C" ? `Class C ambiguity, not counted: each step passes every rule and together they reach goal ${h.goal}, but cancel and rebook inside a permitted cancel ground is the method the policy allows.`
              : `Each step below passes every rule of the policy. Together they reach goal ${h.goal}, an outcome the policy forbids.`}
          </p>
        </div>
        <div className="ctl">
          {h.class === "B" && <span className="tag amber">Class B, contradiction</span>}
          {isFixed ? <span className="tag green"><ShieldCheck aria-hidden="true" />Fixed and enforced</span>
            : h.amendment ? <a className="btn primary" href={holeHref(domain, h.key, "/amendment")}>Review amendment<span className="ic"><ArrowRight aria-hidden="true" /></span></a>
            : <span className="tag">{h.class === "C" ? "Class C, listed for review" : "No amendment drafted"}</span>}
        </div>
      </div>

      <div className="detail">
        <section className="panel" aria-labelledby="trace-h">
          <div className="panel-h">
            <h2 id="trace-h"><span className="exhibit">Exhibit {h.id}</span>Trace replay
              <span className="segs" aria-label={`step ${Math.max(0, Math.min(at, n))} of ${n}`}>{Array.from({ length: n + 1 }, (_, i) => <i key={i} className={i < at ? "on" : i === at ? "cur" : ""} />)}</span>
            </h2>
            <div className="ctl">
              <span className="keys"><kbd>←</kbd><kbd>→</kbd></span>
              <button className="btn sm icon" onClick={() => step(-1)} disabled={at <= 0} aria-label="Previous step" data-tip="Previous step" data-tip-pos="bottom"><ChevronLeft aria-hidden="true" /></button>
              <button className="btn sm" onClick={() => step(1)} disabled={at >= n}>Next step<ChevronRight aria-hidden="true" /></button>
              {playing
                ? <button className="btn sm" onClick={() => setPlaying(false)}><Pause aria-hidden="true" />Pause</button>
                : <button className="btn sm" onClick={replay}><Play aria-hidden="true" />Replay</button>}
            </div>
          </div>
          <ol className={at < 0 ? "trace idle" : "trace"} ref={list} aria-live="polite">
            <span className="track" aria-hidden="true"><span className="fill" /></span>
            <span className="cursor" aria-hidden="true" />
            {h.chain.map((s, i) => {
              const state = i < at ? "past" : i === at ? "current" : "pending";
              return (
                <li key={i} className={`step ${state}`}>
                  <button className="step-h" aria-expanded={state !== "pending" && open === i} disabled={state === "pending"} onClick={() => setOpen(i)}>
                    <span className="node">{state === "past" ? <Check aria-hidden="true" /> : String(i + 1).padStart(2, "0")}</span>
                    <Call step={s} />
                    {state !== "pending" && <span className={`verdict ${s.ok ? "ok" : "no"}`}>{s.ok ? <Check aria-hidden="true" /> : <X aria-hidden="true" />}{s.ok ? "allowed" : "blocked"}</span>}
                  </button>
                  {state !== "pending" && open !== i && <div className="chips">{s.verdicts.map((v, j) => <span key={v.rule_id} style={{ "--i": j }}><Check aria-hidden="true" />{v.rule_id}</span>)}</div>}
                  {state !== "pending" && open === i && (
                    <div className="rules">
                      {s.verdicts.map((v, j) => {
                        const ln = lineOf(lines, v.policy_ref);
                        return (
                          <div className="rule" key={v.rule_id} style={{ "--i": j }}>
                            <Check aria-label="rule passed" />
                            <span className="rid" translate="no">{v.rule_id}{ln > 0 && <small>policy.md:{ln}</small>}</span>
                            <q>{v.policy_ref}</q>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </li>
              );
            })}
            <li className={`outcome ${h.class === "B" ? "b" : ""} ${at >= n ? "" : "pending"}`}>
              <span className="node" aria-hidden="true" />
              <code translate="no">{h.goal} {goal?.name ?? name}</code>
              {at >= n && <span className="verdict"><X aria-hidden="true" />{h.class === "B" ? "forbidden by the text, done by gold" : "forbidden"}</span>}
            </li>
          </ol>
        </section>

        <aside className="side">
          <section className="panel">
            <div className="panel-h"><h2>Proof</h2><span className="tag green">replays {h.replays}</span></div>
            <div className="panel-b" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div className="replays" aria-label={`${h.replays} replays reproduced the outcome`}>
                {Array.from({ length: total || 0 }, (_, i) => <i key={i} style={{ "--i": i }}>{i < ok ? <Check aria-hidden="true" /> : <X aria-hidden="true" />}</i>)}
                <span className="label" style={{ marginLeft: 4 }}>same DB diff on a fresh env</span>
              </div>
              <div className={`money ${h.class === "A" ? "" : "neutral"}`}>
                <Ticker value={h.money_delta} format={usd} ms={1100} className="b-num" />
                <span>{h.money_delta > 0 ? "net paid out to the customer by this chain" : h.money_delta < 0 ? "net charged to the customer; the forbidden change itself is the harm" : "no money moves; the forbidden change itself is the harm"}</span>
              </div>
            </div>
          </section>
          <section className="panel">
            <div className="panel-h"><h2>Forbidden goal</h2><span className="label">{h.goal}</span></div>
            <div className="panel-b" style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {goal && <>
                <div className="paper"><div className="src">policy.md{lineOf(lines, goal.policy_ref) > 0 && `:${lineOf(lines, goal.policy_ref)}`}</div><p className="quote">{quote(goal.policy_ref)}</p></div>
                <code className="pred" translate="no">{goal.name}</code>
              </>}
            </div>
          </section>
          <section className="panel">
            <div className="panel-h"><h2>Database diff</h2><span className="label">before → after</span></div>
            <div className="panel-b">
              {Object.entries(h.diff).flatMap(([coll, recs]) => Object.entries(recs).map(([rid, c]) => (
                <table className="difft" key={coll + rid}>
                  <thead><tr><th colSpan={2}>{coll}.{rid}{!c.before ? " (created)" : !c.after ? " (deleted)" : ""}</th></tr></thead>
                  <tbody>{changedFields(c).map(([k, b, a]) => <tr key={k}><td>{k}</td><td><span className="was">{b}</span> → <span className="now">{a}</span></td></tr>)}</tbody>
                </table>
              )))}
            </div>
          </section>
        </aside>
      </div>
    </div>
  );
}

/* ── Amendment ──────────────────────────────────────── */
function AmendmentView({ domain, h, hkey, ratified, onRatify }) {
  const [busy, setBusy] = useState(false);
  const crumbs = <Crumbs items={[["Report", `#/${domain}/report`], [hkey, holeHref(domain, hkey)], ["Amendment"]]} />;
  if (!h) return <Missing domain={domain} hkey={hkey} crumbs={crumbs} />;
  const a = h.amendment;
  const done = ratified[h.key];
  const goal = GOALS.get(h.goal);
  const { name } = humanize(h.title, h.key);
  if (!a) return (
    <div className="page">{crumbs}
      <section className="panel empty-state">
        <span className="shield"><FileSearch aria-hidden="true" /></span>
        <h1 className="h2">No amendment was drafted for {h.key}</h1>
        <p>Run the audit again with “Draft amendments” on. Muse Spark writes one policy sentence and a rule patch for each proven hole.</p>
        <a className="btn" href="#/">Run an audit</a>
      </section>
    </div>
  );
  const bt = h.backtest, isB = h.class === "B", goldTasks = h.gold?.tasks ?? [];
  const ln = goal ? lineOf(FX.policy, goal.policy_ref) : 0;
  const ratify = () => { setBusy(true); setTimeout(() => { onRatify(h.key); setBusy(false); }, reduced() ? 0 : 800); };
  const Metric = ({ label, v }) => <div className="panel metric"><span>{label}</span>{v === null ? <b className="na">not backtested</b> : <b>{v}</b>}</div>;

  return (
    <div className="page">
      {crumbs}
      <div className="head">
        <div>
          <h1 className="title">{done ? <>Hole {h.id} <span className="g">closed</span></> : <>Amendment <span className="v">{a.id}</span> for {h.id}</>}</h1>
          <p className="lede">
            {isB ? `This finding is a contradiction: the policy text forbids ${name.toLowerCase()}, but ${goldLine(goldTasks, "the benchmark's gold does it in").slice(0, -1)}. Ratifying the rule makes the written policy win over practice.`
              : `A sentence for the policy and the rule that enforces it, so that the trace for ${name.toLowerCase()} no longer passes. Past gold tasks were replayed to count the honest customers it would also stop.`}
          </p>
        </div>
        <Muse>Drafted by Muse Spark, high reasoning</Muse>
      </div>
      <div className="amend">
        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          <section className="diffdoc" aria-label="Policy diff">
            <div className="src"><span>policy.md{ln > 0 && `:${ln}`}</span><span>amendment {a.id}</span></div>
            {goal && <p className="ctx"><span className="m">§{ln > 0 ? ln : ""}</span><span style={{ whiteSpace: "pre-line" }}>{quote(goal.policy_ref)}</span></p>}
            <p className="plus"><span className="m">+</span><span>{a.policy_text}</span></p>
            <span className="note">inserted by amendment {a.id}</span>
          </section>
          <section className="panel">
            <div className="panel-h"><h2>Rule patch</h2><span className="label">{a.rule_patch.length} {a.rule_patch.length === 1 ? "rule" : "rules"} added</span></div>
            <div className="panel-b" style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {a.rule_patch.map((r) => (
                <pre className="code" key={r.id} translate="no"><span className="k">+ </span>{`{ "id": "${r.id}",\n    "tool": "${r.tool}",\n    "allow_if": `}<span className="k">{r.allow_if}</span>{`,\n    "policy_ref": "${r.policy_ref}" }`}</pre>
              ))}
              {a.rationale && <p className="rationale"><b>Why:</b> {a.rationale}</p>}
            </div>
          </section>
        </div>
        <aside className="side">
          <div className="metrics">
            <Metric label="gold tasks replayed" v={bt ? int(bt.tasks) : null} />
            <Metric label={isB ? "gold tasks blocked" : "honest customers blocked"} v={bt ? int(bt.blocked - bt.baseline_blocked) : null} />
            <Metric label={isB ? "stops the chain" : "closes the hole"} v={h.closes === undefined ? null : h.closes ? "yes" : "no"} />
            <Metric label="rules added" v={a.rule_patch.length} />
          </div>
          {done ? (
            <section className="enforced" role="status">
              <span className="stamp">Ratified<small>{when(done)}</small></span>
              <span className="t"><i className="closing" aria-hidden="true" />Enforced by the MCP proxy</span>
              <div className="flow" aria-label="Your agent calls tools through the Bylaw proxy">
                <span><Bot aria-hidden="true" />your agent</span><ArrowRight size={14} aria-hidden="true" />
                <span className="px"><Gavel aria-hidden="true" />bylaw proxy</span><ArrowRight size={14} aria-hidden="true" />
                <span><Wrench aria-hidden="true" />τ² tools</span>
              </div>
              <p style={{ color: "var(--muted)", fontSize: 14 }}>Ratified {when(done)}. The proxy now refuses calls that fail {a.rule_patch.map((r) => r.id).join(", ")}.</p>
              <a className="btn" href={`#/${domain}/report`}>Back to report</a>
            </section>
          ) : (
            <section className="panel ratify-box">
              <h2 className="h2">Ratify this amendment</h2>
              {isB && <p className="tradeoff"><b>Trade-off.</b> {goldLine(goldTasks)} Ratifying forbids it from now on. Ratify only if the written policy should win.</p>}
              {!bt && <p>This amendment was not backtested. Ratify only after reading the rule.</p>}
              <button className="btn ratify" onClick={ratify} disabled={busy}>
                {busy ? <Loader2 className="spin" aria-hidden="true" /> : <Check aria-hidden="true" />}{busy ? "Ratifying…" : "Ratify"}
              </button>
            </section>
          )}
        </aside>
      </div>
    </div>
  );
}

/* ── Bench ──────────────────────────────────────────── */
const LABEL = { muse: "Muse-guided", bfs: "Blind BFS" };
const COLOR = { muse: "#b892ff", bfs: "#8c8a9c" };
const per1k = (h, c) => (c ? (h / c) * 1000 : 0);

function Bench({ domain, broken, loading, onRetry }) {
  const crumbs = <Crumbs items={[[`${domain} bench`]]} />;
  if (loading) return <div className="page">{crumbs}<Loading what="the bench" shape="bench" /></div>;
  if (broken) return <div className="page">{crumbs}<Failure onRetry={onRetry} /></div>;
  if (domain === "retail") return (
    <div className="page">{crumbs}
      <h1 className="title">No {domain} bench yet</h1>
      <section className="panel empty-state">
        <span className="shield"><Gauge aria-hidden="true" /></span>
        <p>The bench compares Muse-guided search with blind BFS on the same budget. Produce it with <code translate="no">uv run python -m bylaw bench --domain {domain} --budget 2000</code>.</p>
      </section>
    </div>
  );
  const { rows, budget } = BENCH;
  const muse = rows.find((r) => r.mode === "muse"), bfs = rows.find((r) => r.mode === "bfs");
  const max = Math.max(1, ...rows.map((r) => r.holes));
  const ratio = per1k(muse.holes, muse.tool_calls) / per1k(bfs.holes, bfs.tool_calls);
  return (
    <div className="page">
      {crumbs}
      <div className="head">
        <div>
          <h1 className="title"><span className="v">Muse-guided</span> search against blind BFS</h1>
          <p className="lede">Same {domain} policy, same budget of {int(budget)} tool calls, same depth limit. Muse Spark proposes chains per forbidden goal before BFS fills the rest of the budget.</p>
        </div>
        <Muse>Chains proposed by Muse Spark, high reasoning</Muse>
      </div>
      <div className="bench">
        <section className="panel">
          <div className="panel-h">
            <h2>Holes proven by tool calls spent <span className="label">log scale</span></h2>
            <div className="legend">{rows.map((r) => <span key={r.mode}><i style={{ background: COLOR[r.mode] }} />{LABEL[r.mode]}</span>)}</div>
          </div>
          <div className="chart"><Curve rows={rows} budget={budget} max={max} /></div>
        </section>
        <aside className="side">
          <section className="panel ratio">
            <span className="label">Holes per tool call</span>
            <Ticker className="big" value={ratio} format={(v) => `${v.toFixed(1)}×`} ms={1400} />
            <p>more with Muse on the same budget. Muse proved its first hole at call {Math.min(...muse.found.map((f) => f.tool_calls))}, blind BFS at call {Math.min(...bfs.found.map((f) => f.tool_calls))}.</p>
          </section>
        </aside>
      </div>
      <section className="panel" style={{ overflowX: "auto" }}>
        <table className="btable">
          <caption className="sr-only">Bench results by mode</caption>
          <thead><tr><th>Mode</th><th>Holes found</th><th>Tool calls</th><th>Holes per 1,000 calls</th><th>LLM calls</th><th>Tokens</th><th>Wall time</th></tr></thead>
          <tbody>{rows.map((r) => (
            <tr key={r.mode}><td><b style={{ color: COLOR[r.mode] }}>{LABEL[r.mode]}</b></td><td>{r.holes}</td><td>{int(r.tool_calls)}</td><td>{per1k(r.holes, r.tool_calls).toFixed(2)}</td><td>{int(r.llm_calls)}</td><td>{int(r.tokens)}</td><td>{r.seconds.toFixed(1)} s</td></tr>
          ))}</tbody>
        </table>
      </section>
    </div>
  );
}

const W = 720, H = 300, L = 40, B = 28, T = 16, R = 72;
function Curve({ rows, budget, max }) {
  const svg = useRef(null), guide = useRef(null), tip = useRef(null), dots = useRef({});
  const span = Math.log10(Math.max(budget, 100)) - 1;
  const x = (c) => L + ((Math.log10(Math.max(c, 10)) - 1) / span) * (W - L - R);
  const y = (h) => H - B - (h / max) * (H - B - T);
  const ticks = [10, 100, 1000, budget].filter((c, i, a) => c <= budget && a.indexOf(c) === i);
  const sorted = (f) => [...f].sort((a, b) => a.tool_calls - b.tool_calls);
  const path = (f) => {
    let d = `M${x(10)},${y(0)}`;
    sorted(f).forEach((p, i) => (d += ` H${x(p.tool_calls)} V${y(i + 1)}`));
    return d + ` H${x(budget)}`;
  };
  const first = (r) => Math.min(...(r.found ?? []).map((f) => f.tool_calls));
  const summary = rows.map((r) => `${LABEL[r.mode]} proves ${r.holes} holes${r.found?.length ? `, the first at call ${first(r)}` : ""}`).join("; ");
  const muse = rows.find((r) => r.mode === "muse");
  // Hover guide: written straight to the SVG through refs, no React render per pointer move.
  const move = (e) => {
    const s = svg.current, pt = s.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(s.getScreenCTM().inverse());
    const gx = Math.min(Math.max(p.x, L), W - R);
    const calls = Math.round(10 ** (1 + ((gx - L) / (W - L - R)) * span));
    const counts = rows.map((r) => [r.mode, (r.found ?? []).filter((f) => f.tool_calls <= calls).length]);
    guide.current.setAttribute("transform", `translate(${gx},0)`);
    guide.current.style.opacity = 1;
    counts.forEach(([m, c]) => dots.current[m]?.setAttribute("cy", y(c)));
    tip.current.textContent = `${int(calls)} calls: ${counts.map(([m, c]) => `${m} ${c}`).join(", ")}`;
    tip.current.setAttribute("text-anchor", gx > W - R - 160 ? "end" : "start");
    tip.current.setAttribute("x", gx > W - R - 160 ? -8 : 8);
  };
  return (
    <svg ref={svg} viewBox={`0 0 ${W} ${H}`} role="img" aria-label={summary} onPointerMove={move} onPointerLeave={() => (guide.current.style.opacity = 0)}>
      <defs>
        <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#9152ff" stopOpacity=".16" /><stop offset="1" stopColor="#9152ff" stopOpacity="0" /></linearGradient>
        <filter id="glow" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="4" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
      </defs>
      {[0, Math.round(max / 2), max].map((h) => (
        <g key={h}><line x1={L} x2={W - R} y1={y(h)} y2={y(h)} stroke="rgba(255,255,255,.07)" strokeDasharray={h ? "3 4" : undefined} /><text x={L - 12} y={y(h) + 4} textAnchor="end">{h}</text></g>
      ))}
      {ticks.map((c) => <text key={c} x={x(c)} y={H - 6} textAnchor="middle">{int(c)}</text>)}
      {muse && <path className="area" d={path(muse.found) + ` V${y(0)} Z`} fill="url(#area)" />}
      {rows.map((r) => (
        <g key={r.mode}>
          <path className="draw" pathLength="1" d={path(r.found ?? [])} fill="none" stroke={COLOR[r.mode]} strokeWidth={r.mode === "muse" ? 2.5 : 1.75} strokeLinejoin="round" />
          {sorted(r.found ?? []).map((p, i) => <circle key={i} className="dot" cx={x(p.tool_calls)} cy={y(i + 1)} r={r.mode === "muse" ? 3 : 2.5} fill={COLOR[r.mode]} style={{ animationDelay: `${0.3 + ((x(p.tool_calls) - L) / (W - L - R)) * 1.6}s` }} />)}
          <text x={x(budget) + 12} y={y(r.found?.length ?? 0) + 4} style={{ fill: COLOR[r.mode], fontWeight: 700 }}>{r.found?.length ?? 0} {r.mode}</text>
        </g>
      ))}
      <g ref={guide} className="guide">
        <line y1={T} y2={H - B} stroke="rgba(255,255,255,.35)" strokeDasharray="2 3" />
        {rows.map((r) => <circle key={r.mode} ref={(el) => (dots.current[r.mode] = el)} r="5" fill="#050508" stroke={COLOR[r.mode]} strokeWidth="2" />)}
        <text ref={tip} y={T + 4} x="8" />
      </g>
    </svg>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
