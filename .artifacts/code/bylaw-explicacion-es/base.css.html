    <style>
      :root {
        --ground: #07090e;
        --panel: #111725;
        --line: #232c40;
        --ink: #f4f6f9;
        --muted: #7d889b;
        --red: #ff4d2e;
        --green: #2be3a0;
        --blue: #5b8cff;
        --paper: #eef1f5;
        --display: "Archivo", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--display); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .huge { font-weight: 900; font-stretch: 64%; text-transform: uppercase; line-height: 0.9; letter-spacing: -0.01em; }
      .red { color: var(--red); } .green { color: var(--green); } .muted { color: var(--muted); }

      /* boarding pass */
      .pass { position: absolute; left: 310px; top: 300px; width: 1300px; height: 480px; background: var(--paper); color: #0b0f17; border-radius: 26px; display: grid; grid-template-columns: 1fr 300px; overflow: hidden; }
      .pass .main { padding: 50px 60px; display: flex; flex-direction: column; justify-content: space-between; }
      .pass .route { font: 900 170px/0.9 var(--display); font-stretch: 72%; }
      .pass .meta { display: flex; gap: 60px; font: 700 30px var(--mono); }
      .pass .meta span { display: flex; flex-direction: column; gap: 6px; }
      .pass .meta small { font: 500 18px var(--mono); color: #5b6576; letter-spacing: 0.1em; }
      .pass .badge { align-self: flex-start; font: 800 30px var(--display); letter-spacing: 0.08em; padding: 10px 20px; border: 4px solid var(--red); color: var(--red); border-radius: 8px; }
      .pass .stub { border-left: 4px dashed #c4cbd6; display: flex; align-items: center; justify-content: center; }
      .pass .bars { width: 120px; height: 360px; background: repeating-linear-gradient(0deg, #0b0f17 0 6px, transparent 6px 10px, #0b0f17 10px 13px, transparent 13px 20px); }
      .hl { background: var(--red); color: #fff; padding: 0 10px; border-radius: 6px; }
      .chip { position: absolute; font: 900 92px/1 var(--display); font-stretch: 80%; text-transform: uppercase; padding: 18px 34px; border-radius: 16px; background: var(--green); color: #04130d; }
      #ok1 { left: 1060px; top: 170px; transform: rotate(-4deg); }
      #ok2 { left: 1080px; top: 170px; transform: rotate(3deg); }
      .flash { position: absolute; inset: 0; background: var(--red); }
      .hole-o { display: inline-block; width: 0.78em; height: 0.78em; border-radius: 50%; background: #000; box-shadow: 0 0 0 0.09em var(--red), 0 0 60px 10px rgba(255,77,46,0.55); vertical-align: -0.02em; margin: 0 0.02em; }

      /* no villain */
      .nos { display: flex; gap: 34px; }
      .no { position: relative; font: 900 84px/1 var(--display); font-stretch: 72%; text-transform: uppercase; color: var(--muted); padding: 18px 30px; border: 4px solid var(--line); border-radius: 16px; }
      .no::after { content: ""; position: absolute; left: -10px; right: -10px; top: 50%; height: 8px; background: var(--red); transform: scaleX(var(--s, 0)); transform-origin: left center; border-radius: 4px; }

      /* market */
      .mk { position: absolute; top: 150px; width: 700px; height: 560px; border-radius: 24px; border: 2px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
      .mk .lbl { font: 700 26px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; }
      .agent { width: 220px; height: 220px; border-radius: 50%; border: 10px solid var(--green); display: grid; place-items: center; font: 900 120px var(--display); color: var(--green); box-shadow: 0 0 80px 10px rgba(43,227,160,0.25); }
      .pol { position: relative; width: 210px; height: 270px; background: var(--paper); border-radius: 14px; padding: 26px; }
      .pol i { display: block; height: 11px; border-radius: 3px; background: #c9d0db; margin-bottom: 15px; }
      .hole { position: absolute; border-radius: 50%; background: #000; }
      .pol .hole { width: 70px; height: 70px; left: 100px; top: 120px; box-shadow: 0 0 0 7px var(--red), 0 0 40px 12px rgba(255,77,46,0.6); }
      .mkline { position: absolute; left: 0; right: 0; font-size: 110px; }

      /* logo */
      .logo { display: flex; align-items: center; gap: 56px; }
      .logo svg { overflow: visible; }
      .word { font: 900 230px/0.8 var(--display); font-stretch: 112%; letter-spacing: -0.03em; }
      .built { margin-top: 56px; font: 700 30px var(--mono); color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; }
      .built b { color: var(--ink); }

      /* capability layout */
      .cap { position: absolute; left: 120px; top: 120px; display: flex; flex-direction: column; gap: 18px; width: 640px; }
      .cap .k { font: 700 26px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--blue); display: flex; align-items: center; gap: 14px; }
      .cap .k::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 20px 4px rgba(91,140,255,0.6); }
      .cap .k.g { color: var(--green); } .cap .k.g::before { background: var(--green); box-shadow: 0 0 20px 4px rgba(43,227,160,0.6); }
      .cap .t { font: 900 150px/0.88 var(--display); font-stretch: 64%; text-transform: uppercase; }
      .cap .d { font: 500 34px/1.3 var(--display); font-stretch: 90%; color: var(--muted); }
      .stage { position: absolute; left: 860px; top: 120px; width: 940px; height: 840px; }

      /* read + watch */
      .sheet { position: absolute; width: 220px; height: 280px; background: var(--paper); border-radius: 12px; padding: 22px; }
      .sheet i { display: block; height: 10px; border-radius: 3px; background: #c9d0db; margin-bottom: 14px; }
      .sheet.case { background: #1a2234; }
      .sheet.case i { background: #2e3a52; }
      .sheet.vid { background: #0c111b; border: 2px solid var(--blue); display: flex; flex-direction: column; justify-content: space-between; }
      .sheet.vid .play { width: 0; height: 0; border-left: 60px solid var(--blue); border-top: 36px solid transparent; border-bottom: 36px solid transparent; margin: 50px auto 0; }
      .sheet.vid span { font: 700 17px var(--mono); color: var(--ink); }
      .ctx { position: absolute; left: 120px; right: 120px; bottom: 30px; display: flex; flex-direction: column; gap: 14px; }
      .ctx .bar { height: 26px; background: var(--line); border-radius: 13px; overflow: hidden; }
      .ctx .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); transform-origin: left center; }
      .ctx .num { font: 900 110px/1 var(--display); font-stretch: 70%; }
      .ctx .num small { font: 700 28px var(--mono); color: var(--muted); letter-spacing: 0.1em; margin-left: 16px; }

      /* graph */
      #graph { position: absolute; inset: 0; width: 940px; height: 840px; }

      /* proof terminal */
      .term { position: absolute; left: 0; right: 0; top: 40px; background: #0c111b; border: 2px solid var(--line); border-radius: 20px; padding: 40px 44px; display: flex; flex-direction: column; gap: 22px; font: 500 26px var(--mono); }
      .term .h { font: 700 22px var(--mono); color: var(--red); letter-spacing: 0.12em; }
      .term .r { display: flex; justify-content: space-between; padding: 18px 22px; border-radius: 10px; background: var(--panel); }
      .term .r b { font-weight: 700; color: var(--green); }
      .term .r.bad { outline: 3px solid var(--red); }
      .term .r.bad b { color: var(--red); }
      .term .q { color: var(--muted); }
      .stamp { position: absolute; right: 30px; bottom: 60px; font: 900 64px/1 var(--display); font-stretch: 80%; color: var(--green); border: 7px solid var(--green); border-radius: 14px; padding: 16px 28px; transform: rotate(-5deg); text-transform: uppercase; white-space: nowrap; }
      .stamp small { display: block; font: 700 20px var(--mono); letter-spacing: 0.1em; margin-top: 8px; }

      /* patch */
      .diff { position: absolute; left: 0; right: 0; top: 30px; background: var(--paper); color: #0b0f17; border-radius: 18px; padding: 40px 44px; display: flex; flex-direction: column; gap: 14px; }
      .diff .f { font: 700 20px var(--mono); color: #5b6576; margin-bottom: 10px; }
      .diff p { font: 600 34px/1.3 var(--display); font-stretch: 90%; padding: 12px 18px; border-radius: 8px; }
      .diff .minus { color: #8a93a3; }
      .diff .plus { background: rgba(43,227,160,0.28); border-left: 8px solid #12b07a; }
      .met { position: absolute; left: 0; right: 0; top: 470px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      .met div { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 28px 32px; display: flex; flex-direction: column; gap: 10px; }
      .met b { font: 900 100px/0.9 var(--display); font-stretch: 66%; color: var(--green); }
      .met span { font: 700 22px var(--mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

      /* bench */
      .bench { display: flex; flex-direction: column; align-items: center; gap: 40px; }
      .bench .logo2 { font: 900 220px/0.9 var(--display); font-stretch: 70%; }
      .bench .sub { font: 700 34px var(--mono); color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
      .trace { display: flex; align-items: center; gap: 26px; }
      .step { font: 700 36px var(--mono); padding: 22px 30px; border-radius: 14px; background: var(--panel); border: 3px solid var(--green); display: flex; gap: 16px; align-items: center; }
      .step b { color: var(--green); }
      .step.bad { border-color: var(--red); }
      .step.bad b { color: var(--red); }
      .arrow { font: 900 60px var(--display); color: var(--muted); }

      /* open weights */
      .bldg { position: absolute; left: 260px; right: 260px; top: 200px; height: 420px; border: 5px dashed var(--line); border-radius: 30px; display: flex; align-items: center; justify-content: center; gap: 60px; }
      .bldg .lbl { position: absolute; left: 40px; top: -22px; background: var(--ground); padding: 0 16px; font: 700 26px var(--mono); color: var(--muted); letter-spacing: 0.16em; text-transform: uppercase; }
      .bldg .pol { width: 170px; height: 220px; }
      .model { font: 900 64px/1 var(--display); font-stretch: 80%; padding: 32px 40px; border-radius: 20px; border: 4px solid var(--blue); color: var(--ink); box-shadow: 0 0 60px 6px rgba(91,140,255,0.3); text-align: center; }
      .model small { display: block; font: 700 22px var(--mono); color: var(--blue); letter-spacing: 0.14em; margin-top: 12px; }

      /* input */
      .card { position: absolute; top: 230px; width: 600px; height: 560px; background: var(--panel); border: 3px solid var(--line); border-radius: 24px; padding: 34px 38px; display: flex; flex-direction: column; gap: 14px; }
      .card .lbl { font: 700 24px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; }
      .card .ttl { font: 900 64px/1 var(--display); font-stretch: 72%; text-transform: uppercase; margin-bottom: 8px; }
      .card .tool { font: 500 24px var(--mono); color: var(--ink); padding: 10px 16px; background: #0c111b; border-radius: 8px; }
      .card .rule { font: 600 26px/1.25 var(--display); font-stretch: 90%; color: #0b0f17; background: var(--paper); padding: 12px 16px; border-radius: 8px; }
      .banner { position: absolute; top: 110px; left: 0; right: 0; text-align: center; font: 700 30px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      .banner b { color: var(--ink); }
      .shock { position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 10px solid var(--red); }

      /* scan */
      .scan { display: flex; flex-direction: column; align-items: center; gap: 30px; }
      .scan .k { font: 700 34px var(--mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--blue); }
      .scan .w { font: 900 330px/0.85 var(--display); font-stretch: 64%; text-transform: uppercase; }
      .scan .v { font: 700 40px var(--mono); color: var(--muted); }
      .scan .v b { color: var(--ink); }

      .bgx { position: absolute; inset: 0; opacity: 0.32; }
      .bgx .sheet { width: 200px; height: 260px; }
      .bigplayer { position: absolute; left: 260px; top: 140px; width: 1400px; height: 800px; background: #0c111b; border: 3px solid var(--blue); border-radius: 26px; overflow: hidden; }
      .bigplayer .row { position: absolute; left: 60px; right: 60px; height: 70px; border-radius: 12px; background: #151c2b; }
      .bigplayer .pb { position: absolute; left: 60px; right: 60px; bottom: 50px; height: 10px; background: var(--line); border-radius: 5px; }
      .bigplayer .pb i { position: absolute; inset: 0; background: var(--red); border-radius: 5px; transform-origin: left center; }
      .scan { position: relative; }
      /* holes */
      .hf { position: absolute; top: 90px; left: 0; right: 0; display: flex; justify-content: center; align-items: baseline; gap: 40px; }
      .hf span { font: 700 40px var(--mono); letter-spacing: 0.2em; color: var(--muted); }
      .hf b { font: 900 260px/0.8 var(--display); font-stretch: 64%; color: var(--red); }
      .hc { position: absolute; top: 470px; width: 520px; height: 400px; background: var(--paper); color: #0b0f17; border-radius: 22px; padding: 34px 36px; display: flex; flex-direction: column; gap: 14px; }
      .hc .hole { position: relative; width: 90px; height: 90px; box-shadow: 0 0 0 8px var(--red), 0 0 50px 14px rgba(255,77,46,0.55); margin-bottom: 10px; }
      .hc .id { font: 700 22px var(--mono); color: var(--red); letter-spacing: 0.12em; }
      .hc .t { font: 900 54px/0.95 var(--display); font-stretch: 70%; text-transform: uppercase; }
      .hc .c { font: 700 22px var(--mono); color: #12a06e; }

      /* v7 graphics */
      .ic { flex: none; display: block; }
      .tgt { position: relative; width: 300px; height: 330px; border: 4px solid var(--line); border-radius: 22px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .tgt span { font: 900 54px/1 var(--display); font-stretch: 72%; text-transform: uppercase; color: var(--muted); }
      .tgt .x { position: absolute; inset: 0; border-radius: 22px; box-shadow: inset 0 0 0 4px var(--red); }
      .tgt .x::before, .tgt .x::after { content: ""; position: absolute; left: 40px; right: 40px; top: 50%; height: 7px; margin-top: -3.5px; background: var(--red); border-radius: 4px; }
      .tgt .x::before { transform: rotate(45deg); } .tgt .x::after { transform: rotate(-45deg); }
      .tgt .ok { position: absolute; top: 14px; right: 18px; font: 700 20px var(--mono); color: var(--red); letter-spacing: 0.1em; }
      #xhair { position: absolute; left: 0; top: 0; width: 200px; height: 200px; }
      .hud { position: absolute; top: 60px; right: 90px; font: 700 30px var(--mono); letter-spacing: 0.14em; color: var(--muted); }
      .hud b { color: var(--red); }
      .runs { position: absolute; left: 0; top: 520px; display: flex; gap: 22px; align-items: center; font: 700 22px var(--mono); color: var(--muted); letter-spacing: 0.12em; }
      .runs i { width: 64px; height: 64px; border-radius: 50%; border: 5px solid var(--line); display: grid; place-items: center; font: 900 30px var(--display); font-style: normal; color: #04130d; }
      .crowd { position: absolute; left: 0; right: 0; top: 330px; display: grid; grid-template-columns: repeat(25, 1fr); gap: 8px 6px; }
      .crowd svg { width: 30px; height: 30px; color: #2e3a52; }
      .fixp { position: absolute; right: 30px; top: -20px; width: 130px; height: 130px; border-radius: 18px; background: var(--green); color: #04130d; font: 900 30px var(--display); display: grid; place-items: center; transform: rotate(-8deg); box-shadow: 0 10px 40px rgba(43,227,160,0.4); }
      .holeD { position: absolute; right: 60px; top: 8px; width: 74px; height: 74px; border-radius: 50%; background: #000; box-shadow: 0 0 0 7px var(--red), 0 0 40px 10px rgba(255,77,46,0.6); }
      .th { display: flex; align-items: center; gap: 36px; }
      .hc .big { position: absolute; right: 30px; top: 30px; }
      .card .head { display: flex; align-items: center; gap: 22px; }
      /* thesis */
      .th { font: 900 140px/1 var(--display); font-stretch: 64%; text-transform: uppercase; }
    </style>
