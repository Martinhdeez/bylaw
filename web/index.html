<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1efe9" media="(prefers-color-scheme: light)" />
    <title>bylaw</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap"
    />
    <!-- Theme before the first paint: the stored choice, else the system preference. -->
    <script>
      try { var t = localStorage.getItem("bylaw.theme"); } catch (e) {}
      // Dark is the app's default (VZ2); a stored choice from the theme toggle wins.
      document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
