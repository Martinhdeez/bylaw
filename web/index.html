<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1efe9" media="(prefers-color-scheme: light)" />
    <title>Bylaw</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&family=Fira+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap"
    />
    <!-- Theme before the first paint: the stored choice, else the system preference. -->
    <script>
      try { var t = localStorage.getItem("bylaw.theme"); } catch (e) {}
      // The Live view defaults to dark (VZ2), the other screens follow the system.
      document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : location.hash.startsWith("#/live") ? "dark" : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
